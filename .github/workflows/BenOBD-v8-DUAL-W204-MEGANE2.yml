              private String formatDuration(long ms) {
                  if (ms < 0L) ms = 0L;
                  long min = ms / 60000L;
                  long sec = (ms % 60000L) / 1000L;
                  long tenth = (ms % 1000L) / 100L;
                  if (min > 0L) {
                      return String.format(Locale.US, "%02d:%02d.%01d",
                              min, sec, tenth);
                  }
                  return String.format(Locale.US, "%d.%01d s", sec, tenth);
              }

