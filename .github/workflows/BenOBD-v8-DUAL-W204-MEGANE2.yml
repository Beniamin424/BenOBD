              private void choosePairedDevice() {
                  if (!hasBtPermission()) {
                      requestBtPermission();
                      return;
                  }
                  if (adapter == null) {
                      dialog("Bluetooth",
                              t("Bluetooth indisponibil pe acest telefon.",
                                      "Bluetooth unavailable on this phone."));
                      return;
                  }
          
                  Set<BluetoothDevice> bonded = adapter.getBondedDevices();
                  List<BluetoothDevice> devices = new ArrayList<>();
                  if (bonded != null) devices.addAll(bonded);
          
                  Collections.sort(devices, new Comparator<BluetoothDevice>() {
                      @Override public int compare(BluetoothDevice a, BluetoothDevice b) {
                          boolean aa = looksLikeObd(safeName(a));
                          boolean bb = looksLikeObd(safeName(b));
                          if (aa != bb) return aa ? -1 : 1;
                          return safeName(a).compareToIgnoreCase(safeName(b));
                      }
                  });
          
                  if (devices.isEmpty()) {
                      dialog(t("Niciun dispozitiv imperecheat", "No paired device"),
                              t("Imperecheaza ELM327/OBDLink din setarile Bluetooth Android, apoi revino.",
                                      "Pair the ELM327/OBDLink in Android Bluetooth settings, then return."));
                      return;
                  }
          
                  String[] names = new String[devices.size()];
                  for (int i = 0; i < devices.size(); i++) {
                      String mark = looksLikeObd(safeName(devices.get(i))) ? "OBD • " : "";
                      names[i] = mark + safeName(devices.get(i)) + "\n" + devices.get(i).getAddress();
                  }
          
                  new AlertDialog.Builder(this)
                          .setTitle(t("Alege adaptorul", "Choose adapter"))
                          .setItems(names, (d, which) -> {
                              selectedDevice = devices.get(which);
                              status.setText(t("Selectat: ", "Selected: ") + safeName(selectedDevice));
                          }).show();
              }
          
              private boolean looksLikeObd(String n) {
                  String low = n == null ? "" : n.toLowerCase(Locale.ROOT);
                  return low.contains("elm") || low.contains("obd") || low.contains("vgate")
                          || low.contains("vlink") || low.contains("obdii")
                          || low.contains("stn") || low.contains("mx+") || low.contains("obdlink");
              }
          
              private void connectSelected() {
                  if (!hasBtPermission()) {
                      requestBtPermission();
                      return;
                  }
                  if (selectedDevice == null) {
                      choosePairedDevice();
                      return;
                  }
          
                  status.setText(t("Conectare...", "Connecting..."));
                  connectButton.setEnabled(false);
          
                  io.execute(() -> {
                      try {
                          closeSocket();
                          socket = selectedDevice.createRfcommSocketToServiceRecord(SPP);
                          socket.connect();
                          input = socket.getInputStream();
                          output = socket.getOutputStream();
          
                          initElm();
          
                          String ati = elm("ATI", 1000);
                          String volts = elm("ATRV", 900);
                          String proto = elm("ATDP", 900);
                          adapterKind = probeAdapterIdentity(ati);

                          appendLog("ADAPTER: " + adapterDetails);
                          appendLog("VOLTAGE: " + clean(volts));
                          appendLog("PROTOCOL: " + clean(proto));
          
                          main.post(() -> {
                              status.setText(t("Conectat: ", "Connected: ")
                                      + safeName(selectedDevice) + " • " + adapterKind
                                      + " • " + clean(volts));
                              updateActivationAdapterStatus();
                              updateVehicleTabStatus();
                              updateRenaultAdapterStatus();
                              refreshActivationProfileBadges();
                              connectButton.setEnabled(true);
                          });
                      } catch (Exception e) {
                          appendLog("CONNECT ERROR: "
                                  + e.getClass().getSimpleName() + " " + e.getMessage());
                          closeSocket();
                          main.post(() -> {
                              status.setText(t("Conectarea a esuat", "Connection failed"));
                              connectButton.setEnabled(true);
                          });
                      }
                  });
              }
          
              private void initElm() throws Exception {
                  elm("ATZ", 2200);
                  elm("ATE0", 800);
                  elm("ATL0", 800);
                  elm("ATS1", 800);
                  elm("ATH0", 800);
                  elm("ATSP0", 1100);
              }
          
              private void runAdapterTest() {
                  if (!requireConnection()) return;
                  io.execute(() -> {
                      StringBuilder sb = new StringBuilder();
                      String[] cmds = {
                              "ATI", "AT@1", "AT@2", "STDI", "STI", "STIX", "STSN",
                              "ATRV", "ATDP", "ATDPN", "ATH1", "ATH0",
                              "ATAL", "ATCAF1", "ATCFC1", "ATST32"
                      };
                      for (String c : cmds) {
                          try {
                              sb.append(c).append(" = ").append(clean(elm(c, 900))).append("\n");
                          } catch (Exception e) {
                              sb.append(c).append(" = ERROR ").append(e.getMessage()).append("\n");
                          }
                      }
                      try { initElm(); } catch (Exception ignored) {}
                      appendLog("ADAPTER CAPABILITY TEST\n" + sb);
                      main.post(() -> vehicleInfo.setText(sb.toString().trim()));
                  });
              }
          
              private void readVehicleInfo() {
                  if (!requireConnection()) return;
                  io.execute(() -> {
                      try {
                          String vinRaw = elm("0902", 2200);
                          String cal = elm("0904", 1800);
                          String cvn = elm("0906", 1800);
                          String ecuName = elm("090A", 1800);
                          String volts = elm("ATRV", 900);
                          String proto = elm("ATDP", 900);
                          String protoNum = elm("ATDPN", 900);
                          String vin = decodeVin(vinRaw);
          
                          String effectiveVin = vin.isEmpty() ? "" : vin;
                          if (effectiveVin.length() == 17) {
                              lastVin = effectiveVin;
                              prefs.edit().putString("last_vin", effectiveVin).apply();
                          }

                          String text = "VIN: " + (effectiveVin.isEmpty()
                                  ? clean(vinRaw) : effectiveVin)
                                  + "\n" + t("Protocol: ", "Protocol: ") + clean(proto)
                                  + " [" + clean(protoNum) + "]"
                                  + "\n" + t("Tensiune: ", "Voltage: ") + clean(volts)
                                  + "\nCalibration ID: " + clean(cal)
                                  + "\nCVN: " + clean(cvn)
                                  + "\nECU Name: " + clean(ecuName)
                                  + "\n" + t("Adaptor detectat: ", "Detected adapter: ")
                                  + adapterKind;

                          appendLog("VEHICLE INFO\n" + text);
                          main.post(() -> {
                              vehicleInfo.setText(text);
                              updateVehicleTabStatus();
                          });

                          if (effectiveVin.length() == 17) {
                              decodeVinOnline(effectiveVin);
                          }
                      } catch (Exception e) {
                          appendLog("IDENTIFY ERROR: " + e.getMessage());
                      }
                  });
              }
          
              private static class RenaultProfileMeta {
                  final String entry;
                  final String ecuName;
                  final String group;
                  final String protocol;
                  final String address;

                  RenaultProfileMeta(String entry, String ecuName,
                                     String group, String protocol,
                                     String address) {
                      this.entry = entry;
                      this.ecuName = ecuName;
                      this.group = group;
                      this.protocol = protocol;
                      this.address = address;
                  }

                  String label() {
                      return (group == null || group.isEmpty() ? "ECU" : group)
                              + " • "
                              + (ecuName == null || ecuName.isEmpty()
                              ? entry : ecuName)
                              + " • "
                              + (protocol == null ? "" : protocol)
                              + " • "
                              + (address == null ? "" : address);
                  }
              }

