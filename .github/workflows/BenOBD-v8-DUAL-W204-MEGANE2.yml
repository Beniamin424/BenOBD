              private String dtcFamily(String code) {
                  if (code == null || code.length() < 1) return "";
                  switch (Character.toUpperCase(code.charAt(0))) {
                      case 'P': return t("Powertrain / motor-transmisie", "Powertrain");
                      case 'B': return t("Body / caroserie-confort", "Body");
                      case 'C': return t("Chassis / sasiu", "Chassis");
                      case 'U': return t("Network / comunicatie", "Network");
                      default: return "";
                  }
              }
          
              private int[] hexBytes(String raw) {
                  if (raw == null) return new int[0];
          
                  String normalized = raw.toUpperCase(Locale.ROOT)
                          .replace("SEARCHING...", " ")
                          .replace("\r", " ")
                          .replace("\n", " ")
                          .replaceAll("[^0-9A-F]", " ");
          
                  String[] tokens = normalized.trim().split("\\s+");
                  ArrayList<Integer> vals = new ArrayList<>();
          
                  for (String token : tokens) {
                      if (token.length() == 2) {
                          try {
                              vals.add(Integer.parseInt(token, 16));
                          } catch (Exception ignored) {}
                      } else if (token.length() > 2 && token.length() % 2 == 0) {
                          for (int i = 0; i < token.length(); i += 2) {
                              try {
                                  vals.add(Integer.parseInt(token.substring(i, i + 2), 16));
                              } catch (Exception ignored) {}
                          }
                      }
                  }
          
                  int[] r = new int[vals.size()];
                  for (int i = 0; i < vals.size(); i++) r[i] = vals.get(i);
                  return r;
              }
          
              private String decodeVin(String raw) {
                  int[] b = hexBytes(raw);
                  StringBuilder vin = new StringBuilder();
                  boolean after = false;
          
                  for (int i = 0; i < b.length; i++) {
                      if (!after && b[i] == 0x49
                              && i + 2 < b.length && b[i + 1] == 0x02) {
                          after = true;
                          i += 2;
                          continue;
                      }
                      if (after) {
                          int v = b[i];
                          if (v >= 0x20 && v <= 0x7E) vin.append((char) v);
                      }
                  }
          
                  String s = vin.toString().replaceAll("[^A-HJ-NPR-Z0-9]", "");
                  if (s.length() >= 17) return s.substring(0, 17);
                  return s;
              }
          
              private String nrcSuffix(String raw) {
                  int[] b = hexBytes(raw);
                  for (int i = 0; i + 2 < b.length; i++) {
                      if (b[i] == 0x7F) {
                          int service = b[i + 1];
                          int nrc = b[i + 2];
                          return "  [NRC 0x"
                                  + String.format(Locale.US, "%02X", nrc)
                                  + " " + nrcName(nrc)
                                  + ", service 0x"
                                  + String.format(Locale.US, "%02X", service) + "]";
                      }
                  }
                  return "";
              }
          
              private String nrcName(int nrc) {
                  switch (nrc) {
                      case 0x10: return "generalReject";
                      case 0x11: return "serviceNotSupported";
                      case 0x12: return "subFunctionNotSupported";
                      case 0x13: return "incorrectLengthOrFormat";
                      case 0x21: return "busyRepeatRequest";
                      case 0x22: return "conditionsNotCorrect";
                      case 0x24: return "requestSequenceError";
                      case 0x31: return "requestOutOfRange";
                      case 0x33: return "securityAccessDenied";
                      case 0x35: return "invalidKey";
                      case 0x36: return "exceedNumberOfAttempts";
                      case 0x37: return "requiredTimeDelayNotExpired";
                      case 0x78: return "responsePending";
                      default: return "negativeResponse";
                  }
              }
          
              private String elm(String command, long waitMs) throws Exception {
                  if (output == null || input == null) {
                      throw new IllegalStateException("No ELM327 socket");
                  }
          
                  while (input.available() > 0) input.read();
          
                  output.write((command + "\r")
                          .getBytes(StandardCharsets.US_ASCII));
                  output.flush();
          
                  long end = System.currentTimeMillis() + waitMs;
                  StringBuilder sb = new StringBuilder();
          
                  while (System.currentTimeMillis() < end) {
                      while (input.available() > 0) {
                          int v = input.read();
                          if (v < 0) break;
          
                          char c = (char) v;
                          if (c == '>') {
                              String r = sb.toString().trim();
                              appendLog("> " + command + "\n" + clean(r));
                              return r;
                          }
                          sb.append(c);
                      }
                      Thread.sleep(20);
                  }
          
                  String r = sb.toString().trim();
                  appendLog("> " + command + "\n" + clean(r) + " [timeout]");
                  return r;
              }
          
              private boolean isUseful(String s) {
                  if (s == null) return false;
                  String x = clean(s).toUpperCase(Locale.ROOT);
                  return !(x.isEmpty()
                          || x.equals("?")
                          || x.contains("NO DATA")
                          || x.contains("UNABLE TO CONNECT")
                          || x.contains("STOPPED"));
              }
          
              private String sanitizeHex(String s) {
                  if (s == null) return "";
                  return s.toUpperCase(Locale.ROOT).replaceAll("[^0-9A-F]", "");
              }
          
              private void appendLog(String text) {
                  main.post(() -> {
                      String old = prefs.getString("tech_log", "");
                      String next = old.isEmpty() ? text : old + "\n\n" + text;

                      if (next.length() > 80000) {
                          next = next.substring(next.length() - 80000);
                      }

                      prefs.edit().putString("tech_log", next).apply();

                      if (log != null) {
                          log.setText(next);
                      }
                  });
              }

              private boolean requireConnection() {
                  if (isConnected()) return true;
          
                  dialog(t("Adaptor neconectat", "Adapter disconnected"),
                          t("Alege adaptorul si conecteaza-l mai intai.",
                                  "Choose and connect the adapter first."));
                  return false;
              }
          
              private boolean isConnected() {
                  return socket != null
                          && socket.isConnected()
                          && input != null
                          && output != null;
              }
          
              private void closeSocket() {
                  liveRunning = false;
                  allLiveRunning = false;
                  main.removeCallbacks(liveTick);
                  main.removeCallbacks(fullLiveTick);
          
                  try { if (input != null) input.close(); } catch (Exception ignored) {}
                  try { if (output != null) output.close(); } catch (Exception ignored) {}
                  try { if (socket != null) socket.close(); } catch (Exception ignored) {}
          
                  input = null;
                  output = null;
                  socket = null;
              }
          
              @Override
              protected void onDestroy() {
                  main.removeCallbacks(obdClock);
                  main.removeCallbacks(deepClock);
                  main.removeCallbacks(fullLiveTick);
                  closeSocket();
                  io.shutdownNow();
                  super.onDestroy();
              }
          
              private boolean hasBtPermission() {
                  return Build.VERSION.SDK_INT < 31
                          || checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT)
                          == PackageManager.PERMISSION_GRANTED;
              }
          
              private void requestBtPermission() {
                  if (Build.VERSION.SDK_INT >= 31 && !hasBtPermission()) {
                      requestPermissions(
                              new String[]{Manifest.permission.BLUETOOTH_CONNECT}, 77);
                  }
              }
          
              private String safeName(BluetoothDevice d) {
                  if (d == null) return "OBD";
          
                  try {
                      String n = d.getName();
                      return n == null || n.trim().isEmpty() ? "Bluetooth device" : n;
                  } catch (SecurityException e) {
                      return "Bluetooth device";
                  }
              }
          
              private String clean(String s) {
                  if (s == null) return "";
                  return s.replace("\r", " ")
                          .replace("\n", " ")
                          .replaceAll("\\s+", " ")
                          .trim();
              }
          
              private String join(List<String> items, String sep) {
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < items.size(); i++) {
                      if (i > 0) sb.append(sep);
                      sb.append(items.get(i));
                  }
                  return sb.toString();
              }
          
              private String t(String ro, String en) {
                  return english ? en : ro;
              }
          
              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }
          
              private void dialog(String title, String msg) {
                  new AlertDialog.Builder(this)
                          .setTitle(title)
                          .setMessage(msg)
                          .setPositiveButton("OK", null)
                          .show();
              }
          
              private TextView label(String text, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(text);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  v.setTypeface(Typeface.create("sans-serif-light",
                          bold ? Typeface.BOLD : Typeface.NORMAL));
                  v.setGravity(Gravity.CENTER_VERTICAL);
                  return v;
              }
          
              private TextView monoBox(String text) {
                  TextView v = label(text, 12, Color.rgb(201, 209, 213), false);
                  v.setTypeface(Typeface.MONOSPACE);
                  v.setPadding(dp(12), dp(12), dp(12), dp(12));
                  v.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));
                  v.setTextIsSelectable(true);
                  return v;
              }
          
              private Button button(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.rgb(15, 17, 19));
                  b.setTextSize(15);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.create("sans-serif-light", Typeface.BOLD));
                  b.setBackground(roundRect(ACCENT, ACCENT, 0, 13));
                  return b;
              }
          
              private Button compactButton(String text) {
                  Button b = button(text);
                  b.setTextSize(13);
                  return b;
              }
          
              private Button secondaryButton(String text) {
