              private void showTab(String tab) {
                  if ("X84".equals(activePlatform)) {
                      diagnosticsTab.setVisibility(View.GONE);
                      fullLiveTab.setVisibility(View.GONE);
                      vehicleTab.setVisibility(View.GONE);
                      activationsTab.setVisibility(View.GONE);
                      logTab.setVisibility(View.GONE);
                      renaultTab.setVisibility(View.VISIBLE);
                      return;
                  }

                  renaultTab.setVisibility(View.GONE);
                  boolean diag = "diag".equals(tab);
                  boolean live = "live".equals(tab);
                  boolean vehicle = "vehicle".equals(tab);
                  boolean act = "act".equals(tab);
                  boolean lg = "log".equals(tab);

                  diagnosticsTab.setVisibility(diag ? View.VISIBLE : View.GONE);
                  fullLiveTab.setVisibility(live ? View.VISIBLE : View.GONE);
                  vehicleTab.setVisibility(vehicle ? View.VISIBLE : View.GONE);
                  activationsTab.setVisibility(act ? View.VISIBLE : View.GONE);
                  logTab.setVisibility(lg ? View.VISIBLE : View.GONE);

                  styleNavButton(navDiagnostics, diag);
                  styleNavButton(navLive, live);
                  styleNavButton(navVehicle, vehicle);
                  styleNavButton(navActivations, act);
                  styleNavButton(navLog, lg);

                  if (lg && log != null) {
                      log.setText(prefs.getString("tech_log", ""));
                  }
                  if (vehicle) {
                      updateVehicleTabStatus();
                  }
                  if (act) {
                      updateActivationAdapterStatus();
                      refreshActivationProfileBadges();
                  }
              }

