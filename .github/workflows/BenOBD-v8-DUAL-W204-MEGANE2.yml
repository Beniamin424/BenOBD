              private void requestActivation(
                      String key, String name, String module, String adapters) {
                  if (!isConnected()) {
                      dialog(t("Interfata necesara", "Interface required"),
                              t("Pentru " + name + " ai nevoie de o interfata compatibila. "
                                              + "Recomandat pentru BenOBD direct: OBDLink MX+/STN. "
                                              + "Alternative de service: OpenPort 2.0/J2534 sau SDconnect C4/C5.\n\n"
                                              + "Modul tinta: " + module,
                                      "For " + name + " you need a compatible interface. "
                                              + "Recommended for direct BenOBD use: OBDLink MX+/STN. "
                                              + "Service alternatives: OpenPort 2.0/J2534 or SDconnect C4/C5.\n\n"
                                              + "Target module: " + module));
                      return;
                  }

                  if ("ELM327".equals(adapterKind)) {
                      dialog(t("ELM327: doar diagnoza", "ELM327: diagnostics only"),
                              t("ELM327 ramane disponibil pentru diagnoza, dar BenOBD nu va face coding cu el. "
                                              + "Pentru activare foloseste OBDLink MX+/STN sau o interfata Mercedes/J2534 compatibila.",
                                      "ELM327 remains available for diagnostics, but BenOBD will not perform coding with it. "
                                              + "Use OBDLink MX+/STN or a compatible Mercedes/J2534 interface."));
                      return;
                  }

                  if (!forceMode) {
                      dialog("Safe Mode",
                              t("Activeaza Force Mode numai dupa Deep Scan si backup.",
                                      "Enable Force Mode only after Deep Scan and backup."));
                      return;
                  }

                  String requiredFamily = requiredFamilyForActivation(key);
                  if (!"UNKNOWN".equals(requiredFamily) && !hasModuleFamily(requiredFamily)) {
                      dialog(t("Modul tinta nedetectat", "Target module not detected"),
                              t("BenOBD nu va scrie pana cand Deep Scan nu identifica familia "
                                              + requiredFamily + ".\n\nProfil: " + profileReferenceForActivation(key),
                                      "BenOBD will not write until Deep Scan identifies the "
                                              + requiredFamily + " family.\n\nProfile: " + profileReferenceForActivation(key)));
                      return;
                  }

                  String detail;
                  if ("amg".equals(key)) {
                      detail = t(
                              "Interfata este compatibila, dar AMG Menu pe IC_204 necesita profil exact si, pe multe versiuni, SecurityAccess seed/key. BenOBD nu va ghici cheia sau bytes de EEPROM.",
                              "The interface is compatible, but AMG Menu on IC_204 requires an exact profile and, on many versions, SecurityAccess seed/key. BenOBD will not guess keys or EEPROM bytes.");
                  } else if ("drl".equals(key)) {
                      detail = t(
                              "Interfata este compatibila. Pentru DRL trebuie identificat Front SAM si varianta lui inainte de coding. BenOBD va permite scrierea doar cand profilul SAM este recunoscut.",
                              "The interface is compatible. DRL coding requires identifying the Front SAM and its variant before coding. BenOBD will allow writing only when the SAM profile is recognized.");
                  } else {
                      detail = t(
                              "Interfata este compatibila. Activarea devine executabila dupa ce Deep Scan identifica modulul si BenOBD gaseste un profil de coding valid pentru software-ul lui.",
                              "The interface is compatible. The activation becomes executable after Deep Scan identifies the module and BenOBD finds a valid coding profile for its software.");
                  }

                  dialog(t("Profil de coding necesar", "Coding profile required"),
                          name + "\n\n" + detail + "\n\n"
                                  + t("Interfete declarate: ", "Declared interfaces: ")
                                  + adapters);
              }

