              private static class ModuleIdentity {
                  final String tx;
                  final String rx;
                  final String raw;
                  final String ascii;
                  final String family;

                  ModuleIdentity(String tx, String rx, String raw,
                                 String ascii, String family) {
                      this.tx = tx;
                      this.rx = rx;
                      this.raw = raw;
                      this.ascii = ascii;
                      this.family = family;
                  }
              }

              private void registerDetectedModule(
                      String tx, String rx, String rawIdentity) {
                  String ascii = printableAsciiFromHex(rawIdentity);
                  String family = classifyMercedesModuleFamily(
                          rawIdentity + " " + ascii);
                  moduleIdentities.add(new ModuleIdentity(
                          tx, rx, rawIdentity, ascii, family));
              }

              private String printableAsciiFromHex(String raw) {
                  int[] b = hexBytes(raw);
                  StringBuilder sb = new StringBuilder();
                  for (int v : b) {
                      if (v >= 0x20 && v <= 0x7E) {
                          sb.append((char) v);
                      }
                  }
                  return sb.toString().trim();
              }

              private String classifyMercedesModuleFamily(String raw) {
                  String x = raw == null ? ""
                          : raw.toUpperCase(Locale.ROOT);

                  if (x.contains("IC_204")
                          || x.contains("INSTRUMENT")
                          || x.contains("KOMBI")
                          || x.contains("204902")
                          || x.contains("204442")
                          || x.contains("212902")
                          || x.contains("212442")) {
                      return "IC_204";
                  }
                  if (x.contains("SAMF_204")
                          || x.contains("SAMF")
                          || x.contains("FRONT SAM")) {
                      return "SAMF_204";
                  }
                  if (x.contains("SAMR_204")
                          || x.contains("SAMR")
                          || x.contains("REAR SAM")) {
                      return "SAMR_204";
                  }
                  if (x.contains("CGW_204")
                          || x.contains("CGW")
                          || x.contains("CENTRAL GATEWAY")) {
                      return "CGW_204";
                  }
                  if (x.contains("DOOR")
                          || x.contains("TUER")
                          || x.contains("TURSTEUER")) {
                      return "DOOR_204";
                  }
                  return "UNKNOWN";
              }

              private boolean hasModuleFamily(String family) {
                  for (ModuleIdentity m : moduleIdentities) {
                      if (family.equals(m.family)) return true;
                  }
                  return false;
              }

              private String requiredFamilyForActivation(String key) {
                  if ("needle".equals(key) || "amg".equals(key)
                          || "speed".equals(key)) return "IC_204";
                  if ("drl".equals(key) || "welcome".equals(key)
                          || "confirm".equals(key)) return "SAMF_204";
                  if ("autolock".equals(key)) return "CGW_204";
                  if ("mirrors".equals(key)) return "DOOR_204";
                  return "UNKNOWN";
              }

              private String profileReferenceForActivation(String key) {
                  if ("amg".equals(key)) return "IC_204 / SecurityAccess + EEPROM profile";
                  if ("needle".equals(key)) return "IC_204 / Variant Coding";
                  if ("speed".equals(key)) return "IC_204 / Variant Coding";
                  if ("drl".equals(key)) return "SAMF_204 / VCD_tagfahrlicht";
                  if ("welcome".equals(key)) return "SAMF_204 + CGW_204 / exterior-light profile";
                  if ("confirm".equals(key)) return "SAMF_204 + CGW_204 / lock-confirmation profile";
                  if ("autolock".equals(key)) return "CGW_204 / central-lock profile";
                  if ("mirrors".equals(key)) return "CGW_204 + DOOR_204 / folding-mirror profile";
                  return "Mercedes coding profile";
              }

              private String profileStatusForActivation(String key) {
                  String family = requiredFamilyForActivation(key);
                  String ref = profileReferenceForActivation(key);
                  if (!isConnected()) {
                      return t("Status: asteapta adaptor + Deep Scan • ",
                              "Status: waiting for adapter + Deep Scan • ") + ref;
                  }
                  if (!adapterSupportsProfileCoding()) {
                      return t("Status: adaptor doar diagnoza • ",
                              "Status: diagnostics-only adapter • ") + ref;
                  }
                  if ("UNKNOWN".equals(family)) {
                      return t("Status: necesita identificare modul • ",
                              "Status: module identification required • ") + ref;
                  }
                  if (hasModuleFamily(family)) {
                      return t("Status: familie detectata; profil exact trebuie validat pentru SW • ",
                              "Status: family detected; exact profile must be validated for SW • ") + ref;
                  }
                  return t("Status: modul tinta nu a fost identificat inca • ",
                          "Status: target module not identified yet • ") + ref;
              }

              private void refreshActivationProfileBadges() {
                  for (Map.Entry<String, TextView> e : activationStatusViews.entrySet()) {
                      if (e.getValue() != null) {
                          e.getValue().setText(profileStatusForActivation(e.getKey()));
                      }
                  }
              }

              private String buildModuleProfileReport() {
                  StringBuilder sb = new StringBuilder();
                  sb.append(t("ADAPTOR\n", "ADAPTER\n"))
                          .append(adapterKind).append("\n")
                          .append(adapterDetails).append("\n\n");
                  if (moduleIdentities.isEmpty()) {
                      sb.append(t(
                              "Niciun identificator Mercedes de modul nu a fost retinut in aceasta scanare. Asta poate insemna ca adaptorul/protocolul nu ajunge la modulele de caroserie sau ca modulul foloseste o adresare specifica Mercedes.\n",
                              "No Mercedes module identifier was retained in this scan. This can mean the adapter/protocol cannot reach body modules or that the module uses Mercedes-specific addressing.\n"));
                  } else {
                      sb.append(t("MODULE DETECTATE\n", "DETECTED MODULES\n"));
                      for (ModuleIdentity m : moduleIdentities) {
                          sb.append("• TX ").append(m.tx)
                                  .append(" / RX ").append(m.rx)
                                  .append("  →  ").append(m.family).append("\n");
                          if (!m.ascii.isEmpty()) sb.append("  ASCII: ").append(m.ascii).append("\n");
                          sb.append("  ID: ").append(m.raw).append("\n");
                      }
                  }
                  sb.append("\n").append(t("PROFILE CODING\n", "CODING PROFILES\n"))
                          .append("IC_204: ").append(hasModuleFamily("IC_204") ? t("familie detectata", "family detected") : t("nedetectat", "not detected"))
                          .append("\nSAMF_204: ").append(hasModuleFamily("SAMF_204") ? t("familie detectata", "family detected") : t("nedetectat", "not detected"))
                          .append("\nCGW_204: ").append(hasModuleFamily("CGW_204") ? t("familie detectata", "family detected") : t("nedetectat", "not detected"))
                          .append("\nDOOR_204: ").append(hasModuleFamily("DOOR_204") ? t("familie detectata", "family detected") : t("nedetectat", "not detected"))
                          .append("\n\n")
                          .append(t(
                                  "BenOBD selecteaza automat familia profilului, dar nu executa o scriere daca identificatorul software nu are o reteta exacta validata. Nu sunt folositi bytes ghiciti.",
                                  "BenOBD automatically selects the profile family, but does not write unless the software identifier has an exact validated recipe. No guessed bytes are used."));
                  return sb.toString();
              }

              private void updateVehicleTabStatus() {
                  if (vehicleAdapterStatus != null) {
                      vehicleAdapterStatus.setText(t("Adaptor: ", "Adapter: ") + adapterKind
                              + (adapterDetails.isEmpty() ? "" : "\n" + adapterDetails));
                  }
                  String vin = lastVin;
                  if (vin == null || vin.length() != 17) vin = prefs.getString("last_vin", "");
                  if (vehicleVinStatus != null) {
                      vehicleVinStatus.setText(vin.length() == 17 ? "VIN: " + vin
                              : t("VIN: asteapta identificarea ECU", "VIN: waiting for ECU identification"));
                  }
                  if (vehicleProfileBox != null) {
                      String profile = prefs.getString("vehicle_profile", "");
                      if (!profile.isEmpty()) vehicleProfileBox.setText(profile);
                  }
                  if (moduleProfileBox != null && !moduleIdentities.isEmpty()) {
                      moduleProfileBox.setText(buildModuleProfileReport());
                  }
              }

              private void decodeVinOnline(String vin) {
                  if (vin == null || vin.length() != 17) return;
                  final String requestedVin = vin;
                  if (vehicleVinStatus != null) {
                      vehicleVinStatus.setText("VIN: " + requestedVin + " • " + t("decodare...", "decoding..."));
                  }
                  io.execute(() -> {
                      try {
                          String url = "https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValuesExtended/"
                                  + requestedVin + "?format=json";
                          String json = httpGet(url);
                          JSONObject rootJson = new JSONObject(json);
                          JSONArray results = rootJson.optJSONArray("Results");
                          if (results == null || results.length() == 0) throw new IllegalStateException("vPIC: no Results");
                          JSONObject x = results.getJSONObject(0);
                          StringBuilder sb = new StringBuilder();
                          sb.append("VIN: ").append(requestedVin).append("\n\n");
                          appendVinField(sb,x,"Make",t("Marca","Make"),t("Marca decodata din VIN.","Make decoded from VIN."));
                          appendVinField(sb,x,"Model",t("Model","Model"),t("Modelul raportat de producator.","Model reported by the manufacturer."));
                          appendVinField(sb,x,"ModelYear",t("An model","Model year"),t("Anul de model asociat VIN-ului.","Model year associated with the VIN."));
                          appendVinField(sb,x,"Series",t("Serie","Series"),t("Seria/varianta comerciala raportata.","Reported series/commercial variant."));
                          appendVinField(sb,x,"Trim","Trim",t("Nivelul/versiunea de echipare disponibila in baza VIN.","Trim/equipment level available in VIN data."));
                          appendVinField(sb,x,"BodyClass",t("Caroserie","Body class"),t("Tipul de caroserie decodat.","Decoded body type."));
                          appendVinField(sb,x,"Doors",t("Usi","Doors"),t("Numarul de usi raportat.","Reported number of doors."));
                          appendVinField(sb,x,"EngineModel",t("Motorizare / cod motor","Engine / engine model"),t("Modelul sau codul motorului, daca este disponibil.","Engine model/code when available."));
                          appendVinField(sb,x,"EngineManufacturer",t("Producator motor","Engine manufacturer"),t("Producatorul motorului din datele VIN.","Engine manufacturer from VIN data."));
                          appendVinField(sb,x,"DisplacementL",t("Cilindree","Displacement"),t("Cilindreea nominala in litri.","Nominal displacement in litres."));
                          appendVinField(sb,x,"EngineCylinders",t("Cilindri","Cylinders"),t("Numarul de cilindri raportat.","Reported cylinder count."));
                          appendVinField(sb,x,"EngineHP",t("Putere motor","Engine power"),t("Puterea declarata, daca este disponibila.","Declared power when available."));
                          appendVinField(sb,x,"FuelTypePrimary",t("Combustibil","Fuel"),t("Tipul principal de combustibil.","Primary fuel type."));
                          appendVinField(sb,x,"DriveType",t("Tractiune","Drive type"),t("Configuratia tractiunii.","Drivetrain configuration."));
                          appendVinField(sb,x,"TransmissionStyle",t("Transmisie","Transmission"),t("Tipul transmisiei raportate.","Reported transmission type."));
                          appendVinField(sb,x,"TransmissionSpeeds",t("Trepte transmisie","Transmission speeds"),t("Numarul de trepte, daca este disponibil.","Number of gears when available."));
                          appendVinField(sb,x,"PlantCountry",t("Tara fabricatie","Plant country"),t("Tara uzinei asociate VIN-ului.","Manufacturing plant country."));
                          appendVinField(sb,x,"PlantCity",t("Oras fabrica","Plant city"),t("Orasul uzinei, daca este disponibil.","Plant city when available."));
                          sb.append("\n").append(t("DOTARI / SISTEME RAPORTATE\n","REPORTED EQUIPMENT / SYSTEMS\n"));
                          appendOption(sb,x,"ABS","ABS",t("Sistem antiblocare la franare.","Anti-lock braking system."));
                          appendOption(sb,x,"ESC","ESP / ESC",t("Control electronic al stabilitatii.","Electronic stability control."));
                          appendOption(sb,x,"TractionControl",t("Control tractiune","Traction control"),t("Controlul patinarii.","Traction/slip control."));
                          appendOption(sb,x,"TPMS","TPMS",t("Monitorizarea presiunii in pneuri.","Tyre pressure monitoring."));
                          appendOption(sb,x,"ParkAssist","Park Assist / PTS",t("Asistenta la parcare raportata.","Reported parking assistance."));
                          appendOption(sb,x,"AdaptiveCruiseControl","Adaptive Cruise Control",t("Cruise control adaptiv, daca este raportat.","Adaptive cruise control when reported."));
                          appendOption(sb,x,"BlindSpotMon","Blind Spot",t("Monitorizare unghi mort.","Blind-spot monitoring."));
                          appendOption(sb,x,"LaneDepartureWarning",t("Avertizare banda","Lane departure warning"),t("Avertizare parasire banda.","Lane departure warning."));
                          appendOption(sb,x,"LaneKeepSystem","Lane Keep",t("Asistenta mentinere banda.","Lane-keeping assistance."));
                          appendOption(sb,x,"ForwardCollisionWarning",t("Avertizare coliziune","Forward collision warning"),t("Avertizare coliziune frontala.","Forward collision warning."));
                          appendOption(sb,x,"KeylessIgnition","Keyless",t("Pornire/acces fara cheie, daca este raportat.","Keyless ignition/access when reported."));
                          appendOption(sb,x,"DaytimeRunningLight","DRL",t("Lumini de zi raportate in configuratia VIN.","Daytime running lights reported in VIN configuration."));
                          appendOption(sb,x,"SemiautomaticHeadlampBeamSwitching",t("Asistenta faza lunga","High-beam assistance"),t("Comutare automata/semi-automata a fazei.","Automatic/semi-automatic beam switching."));
                          appendOption(sb,x,"BackupCamera",t("Camera marsarier","Backup camera"),t("Camera spate raportata in baza VIN.","Rear camera reported in VIN data."));
                          String errors=x.optString("ErrorText","").trim();
                          if (!errors.isEmpty() && !errors.startsWith("0 - VIN decoded clean")) sb.append("\n").append(t("NOTA DECODOR: ","DECODER NOTE: ")).append(errors).append("\n");
                          sb.append("\n").append(t(
                                  "Nota: vPIC foloseste date publice VIN. Pentru un W204 european, unele campuri pot lipsi. Lipsa unui camp nu inseamna ca masina nu are acea dotare. Mercedes Data Card / codurile SA sunt o sursa separata.",
                                  "Note: vPIC uses public VIN data. For a European W204, some fields may be missing. A missing field does not mean the car lacks that feature. Mercedes Data Card / SA codes are a separate source."));
                          final String profile=sb.toString();
                          prefs.edit().putString("vehicle_profile",profile).putString("last_vin",requestedVin).apply();
                          appendLog("VIN PROFILE\n"+profile);
                          main.post(() -> {
                              lastVin=requestedVin;
                              if (vehicleProfileBox!=null) vehicleProfileBox.setText(profile);
                              if (vehicleVinStatus!=null) vehicleVinStatus.setText("VIN: "+requestedVin+" • "+t("profil actualizat","profile updated"));
                          });
                      } catch (Exception e) {
                          appendLog("VIN DECODE ERROR: "+e.getClass().getSimpleName()+" "+e.getMessage());
                          main.post(() -> {
                              if (vehicleVinStatus!=null) vehicleVinStatus.setText("VIN: "+requestedVin+" • "+t("decodare indisponibila","decode unavailable"));
                          });
                      }
                  });
              }

              private String httpGet(String urlString) throws Exception {
                  HttpURLConnection c=null;
                  BufferedReader reader=null;
                  try {
                      URL u=new URL(urlString);
                      c=(HttpURLConnection)u.openConnection();
                      c.setConnectTimeout(6500);
                      c.setReadTimeout(6500);
                      c.setRequestMethod("GET");
                      c.setRequestProperty("Accept","application/json");
                      c.setRequestProperty("User-Agent","BenOBD/7.0");
                      int code=c.getResponseCode();
                      if (code<200 || code>=300) throw new IllegalStateException("HTTP "+code);
                      reader=new BufferedReader(new InputStreamReader(c.getInputStream(),StandardCharsets.UTF_8));
                      StringBuilder sb=new StringBuilder();
                      String line;
                      while ((line=reader.readLine())!=null) sb.append(line);
                      return sb.toString();
                  } finally {
                      try { if (reader!=null) reader.close(); } catch(Exception ignored) {}
                      if (c!=null) c.disconnect();
                  }
              }

              private void appendVinField(StringBuilder sb, JSONObject x, String key, String label, String description) {
                  String value=cleanVinValue(x.optString(key,""));
                  if (value.isEmpty()) return;
                  sb.append(label).append(": ").append(value).append("\n  ↳ ").append(description).append("\n");
              }

              private void appendOption(StringBuilder sb, JSONObject x, String key, String label, String description) {
                  String value=cleanVinValue(x.optString(key,""));
                  if (value.isEmpty()) return;
                  sb.append("• ").append(label).append(": ").append(value).append("\n  ↳ ").append(description).append("\n");
              }

              private String cleanVinValue(String value) {
                  if (value==null) return "";
                  String v=value.trim();
                  if (v.isEmpty() || v.equalsIgnoreCase("Not Applicable") || v.equalsIgnoreCase("Not Available") || v.equalsIgnoreCase("N/A") || v.equalsIgnoreCase("null")) return "";
                  return v;
              }

              private void updateActivationAdapterStatus() {
                  if (activationAdapterStatus == null) return;
                  StringBuilder sb = new StringBuilder();
                  sb.append(t("Interfata curenta: ", "Current interface: ")).append(adapterKind);
                  if (adapterSupportsProfileCoding()) {
                      sb.append(t("\n✓ STN/OBDLink detectat: raw CAN/UDS disponibil pentru profile validate.",
                              "\n✓ STN/OBDLink detected: raw CAN/UDS available for validated profiles."));
                  } else {
                      sb.append(t("\n• Diagnoza disponibila; coding direct ramane blocat pe acest adaptor.",
                              "\n• Diagnostics available; direct coding remains locked on this adapter."));
                  }
                  if (!adapterDetails.isEmpty()) sb.append("\n").append(adapterDetails);
                  activationAdapterStatus.setText(sb.toString());
              }

              private String probeAdapterIdentity(String ati) {
                  String btName = selectedDevice == null ? ""
                          : safeName(selectedDevice);
                  String stdi = tryElmIdentity("STDI");
                  String sti = tryElmIdentity("STI");
                  String stix = tryElmIdentity("STIX");
                  String stsn = tryElmIdentity("STSN");

                  String all = (clean(ati) + " " + clean(stdi) + " "
                          + clean(sti) + " " + clean(stix) + " "
                          + btName).toUpperCase(Locale.ROOT);

                  String kind;
                  if (all.contains("OBDLINK MX+")) {
                      kind = "OBDLink MX+ / STN";
                  } else if (all.contains("OBDLINK")) {
                      kind = "OBDLink / STN";
                  } else if (all.contains("STN11") || all.contains("STN21")
                          || all.contains("STN")) {
                      kind = "STN";
                  } else if (all.contains("VLINKER") || all.contains("VGATE")) {
                      kind = "vLinker / Vgate (ELM compatible)";
                  } else if (all.contains("ELM327") || all.contains("ELM")) {
                      kind = "ELM327";
                  } else {
                      kind = clean(ati).isEmpty() ? "UNKNOWN" : clean(ati);
                  }

                  adapterDetails = "Bluetooth: " + btName
                          + "\nATI: " + clean(ati)
                          + "\nSTDI: " + clean(stdi)
                          + "\nSTI: " + clean(sti)
                          + "\nSTIX: " + clean(stix)
                          + "\nSTSN: " + clean(stsn);

                  return kind;
              }

              private String tryElmIdentity(String command) {
                  try {
                      String r = elm(command, 850);
                      String x = clean(r);
                      if (x.equals("?") || x.contains("NO DATA")
                              || x.contains("ERROR")) return "";
                      return x;
                  } catch (Exception e) {
                      return "";
                  }
              }

              private boolean adapterSupportsProfileCoding() {
                  String a = adapterKind == null ? "" : adapterKind.toUpperCase(Locale.ROOT);
                  return a.contains("OBDLINK") || a.equals("STN")
                          || a.startsWith("STN ");
              }

