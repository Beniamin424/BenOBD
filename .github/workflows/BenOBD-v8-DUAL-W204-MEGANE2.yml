              private void chooseRenaultDatabase() {
                  Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                  i.addCategory(Intent.CATEGORY_OPENABLE);
                  i.setType("*/*");
                  i.putExtra(Intent.EXTRA_MIME_TYPES,
                          new String[] {
                                  "application/zip",
                                  "application/octet-stream",
                                  "application/json"
                          });
                  startActivityForResult(i, REQ_RENAULT_ECU_ZIP);
              }

              @Override
              protected void onActivityResult(
                      int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != REQ_RENAULT_ECU_ZIP
                          || resultCode != RESULT_OK
                          || data == null
                          || data.getData() == null) {
                      return;
                  }

                  Uri uri = data.getData();
                  try {
                      int flags = data.getFlags()
                              & (Intent.FLAG_GRANT_READ_URI_PERMISSION
                              | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      getContentResolver()
                              .takePersistableUriPermission(uri, flags);
                  } catch (Exception ignored) {}

                  prefs.edit()
                          .putString("renault_ecu_uri",
                                  uri.toString())
                          .apply();
                  indexRenaultDatabase(uri);
              }

              private void restoreRenaultDatabase() {
                  if (!renaultProfiles.isEmpty()) return;
                  String s = prefs.getString("renault_ecu_uri", "");
                  if (s.isEmpty()) return;
                  try {
                      indexRenaultDatabase(Uri.parse(s));
                  } catch (Exception ignored) {}
              }

              private void indexRenaultDatabase(Uri uri) {
                  if (renaultDbStatus != null) {
                      renaultDbStatus.setText(t(
                              "Indexez baza Renault X84...",
                              "Indexing Renault X84 database..."));
                  }

                  io.execute(() -> {
                      try {
                          String dbJson = readDbJsonFromUri(uri);
                          if (dbJson == null || dbJson.trim().isEmpty()) {
                              throw new IllegalStateException(
                                      "db.json lipseste din arhiva");
                          }

                          JSONObject db = new JSONObject(dbJson);
                          ArrayList<RenaultProfileMeta> found =
                                  new ArrayList<>();

                          JSONArray names = db.names();
                          if (names != null) {
                              for (int i = 0; i < names.length(); i++) {
                                  String key = names.optString(i, "");
                                  JSONObject v = db.optJSONObject(key);
                                  if (v == null) continue;

                                  JSONArray projects =
                                          v.optJSONArray("projects");
                                  boolean x84 = false;
                                  if (projects != null) {
                                      for (int j = 0;
                                           j < projects.length(); j++) {
                                          String pr = projects
                                                  .optString(j, "")
                                                  .toUpperCase(Locale.ROOT);
                                          if (pr.startsWith("X84")
                                                  || pr.contains("X84")) {
                                              x84 = true;
                                              break;
                                          }
                                      }

                                  if (!x84) continue;

                                  found.add(new RenaultProfileMeta(
                                          key,
                                          v.optString("ecuname", ""),
                                          v.optString("group", ""),
                                          v.optString("protocol", ""),
                                          v.optString("address", "")));
                              }
                          }

                          Collections.sort(found,
                                  (a, b) -> a.label()
                                          .compareToIgnoreCase(
                                                  b.label()));

                          synchronized (renaultProfiles) {
                              renaultProfiles.clear();
                              renaultProfiles.addAll(found);
                          }

                          HashMap<String, Integer> groups =
                                  new HashMap<>();
                          HashMap<String, Integer> protocols =
                                  new HashMap<>();

                          for (RenaultProfileMeta m : found) {
                              String g = m.group == null
                                      || m.group.isEmpty()
                                      ? "OTHER" : m.group;
                              groups.put(g,
                                      groups.containsKey(g)
                                              ? groups.get(g) + 1 : 1);

                              String p = m.protocol == null
                                      || m.protocol.isEmpty()
                                      ? "UNKNOWN" : m.protocol;
                              protocols.put(p,
                                      protocols.containsKey(p)
                                              ? protocols.get(p) + 1 : 1);
                          }

                          StringBuilder sb = new StringBuilder();
                          sb.append(t("Baza Renault incarcata\n",
                                  "Renault database loaded\n"));
                          sb.append(t("Profile X84 gasite: ",
                                  "X84 profiles found: "))
                                  .append(found.size())
                                  .append("\n\n");

                          sb.append(t("Protocoale:\n",
                                  "Protocols:\n"));
                          for (Map.Entry<String, Integer> e
                                  : protocols.entrySet()) {
                              sb.append("• ")
                                      .append(e.getKey())
                                      .append(": ")
                                      .append(e.getValue())
                                      .append("\n");
                          }

                          sb.append("\n")
                                  .append(t("Grupe ECU:\n",
                                          "ECU groups:\n"));
                          int shown = 0;
                          for (Map.Entry<String, Integer> e
                                  : groups.entrySet()) {
                              if (shown++ >= 30) break;
                              sb.append("• ")
                                      .append(e.getKey())
                                      .append(": ")
                                      .append(e.getValue())
                                      .append("\n");
                          }

                          final String summary =
                                  sb.toString().trim();
                          prefs.edit()
                                  .putString("renault_db_summary",
                                          summary)
                                  .apply();

                          appendLog("RENAULT X84 DATABASE\n"
                                  + summary);

                          main.post(() -> {
                              if (renaultDbStatus != null) {
                                  renaultDbStatus.setText(summary);
                              }
                          });
                      } catch (Exception e) {
                          appendLog("RENAULT DB ERROR: "
                                  + e.getClass().getSimpleName()
                                  + " " + e.getMessage());
                          main.post(() -> {
                              if (renaultDbStatus != null) {
                                  renaultDbStatus.setText(
                                          t("Eroare baza Renault: ",
                                                  "Renault database error: ")
                                                  + e.getMessage());
                              }
                          });
                      }
                  });
              }

              private String readDbJsonFromUri(Uri uri)
                      throws Exception {
                  InputStream in =
                          getContentResolver().openInputStream(uri);
                  if (in == null) return null;

                  ZipInputStream zis = null;
                  try {
                      zis = new ZipInputStream(in);
                      ZipEntry ze;
                      while ((ze = zis.getNextEntry()) != null) {
                          String n = ze.getName();
                          if (n != null
                                  && (n.equalsIgnoreCase("db.json")
                                  || n.toLowerCase(Locale.ROOT)
                                  .endsWith("/db.json"))) {
                              return readText(zis);
                          }
                      }
                  } catch (Exception zipError) {
                      try { in.close(); } catch (Exception ignored) {}
                      InputStream jsonIn =
                              getContentResolver()
                                      .openInputStream(uri);
                      if (jsonIn == null) return null;
                      try {
                          return readText(jsonIn);
                      } finally {
                          jsonIn.close();
                      }
                  } finally {
                      try {
                          if (zis != null) zis.close();
                          else in.close();
                      } catch (Exception ignored) {}
                  }
                  return null;
              }

              private String readText(InputStream in)
                      throws Exception {
                  ByteArrayOutputStream out =
                          new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) {
                      out.write(buf, 0, n);
                  }
                  return new String(out.toByteArray(),
                          StandardCharsets.UTF_8);
              }

