              private String formatUdsDtcResponse(String raw) {
                  String nrc = nrcSuffix(raw);
                  if (!nrc.isEmpty()) return clean(raw) + nrc;
          
                  int[] b = hexBytes(raw);
                  int start = -1;
                  for (int i = 0; i + 2 < b.length; i++) {
                      if (b[i] == 0x59 &&
                              (b[i + 1] == 0x02 || b[i + 1] == 0x0A
                                      || b[i + 1] == 0x0F || b[i + 1] == 0x15)) {
                          start = i + 2;
                          break;
                      }
                  }
                  if (start < 0) return clean(raw);
          
                  StringBuilder sb = new StringBuilder();
                  int idx = start;
          
                  if (idx < b.length) {
                      int availability = b[idx++];
                      sb.append("StatusAvailabilityMask=0x")
                              .append(String.format(Locale.US, "%02X", availability)).append("\n");
                  }
          
                  while (idx + 3 < b.length) {
                      String dtc = String.format(Locale.US, "%02X%02X%02X",
                              b[idx], b[idx + 1], b[idx + 2]);
                      int statusByte = b[idx + 3];
                      sb.append("• UDS ").append(dtc)
                              .append("  status=0x")
                              .append(String.format(Locale.US, "%02X", statusByte))
                              .append("  ").append(decodeDtcStatus(statusByte))
                              .append("\n  ↳ ").append(udsStatusExplanation(statusByte))
                              .append("\n  ↳ ").append(t(
                                      "Cod Mercedes/UDS de 24 biti; componenta exacta necesita baza specifica modulului.",
                                      "24-bit Mercedes/UDS code; exact component wording requires a module-specific database."))
                              .append("\n");
                      idx += 4;
                  }
          
                  if (sb.length() == 0) return clean(raw);
                  return sb.toString().trim();
              }
          
              private List<String> extractUdsDtcs(String raw) {
                  int[] b = hexBytes(raw);
                  ArrayList<String> out = new ArrayList<>();
                  int start = -1;
                  for (int i = 0; i + 2 < b.length; i++) {
                      if (b[i] == 0x59 && b[i + 1] == 0x02) {
                          start = i + 3;
                          break;
                      }
                  }
                  if (start < 0) return out;
          
                  for (int i = start; i + 3 < b.length; i += 4) {
                      out.add(String.format(Locale.US, "%02X%02X%02X",
                              b[i], b[i + 1], b[i + 2]));
                  }
                  return out;
              }
          
              private String decodeDtcStatus(int s) {
                  ArrayList<String> f = new ArrayList<>();
                  if ((s & 0x01) != 0) f.add("testFailed");
                  if ((s & 0x02) != 0) f.add("failedThisCycle");
                  if ((s & 0x04) != 0) f.add("pending");
                  if ((s & 0x08) != 0) f.add("confirmed");
                  if ((s & 0x10) != 0) f.add("notCompletedSinceClear");
                  if ((s & 0x20) != 0) f.add("failedSinceClear");
                  if ((s & 0x40) != 0) f.add("notCompletedThisCycle");
                  if ((s & 0x80) != 0) f.add("warningRequested");
                  if (f.isEmpty()) return "no status flags";
                  return join(f, ", ");
              }
          
              private void passiveCanMonitor() {
                  if (!requireConnection()) return;
          
                  new AlertDialog.Builder(this)
                          .setTitle(t("Monitor CAN pasiv", "Passive CAN monitor"))
                          .setMessage(t(
                                  "BenOBD va asculta traficul CAN aproximativ 5 secunde si nu va transmite comenzi de diagnoza in acest interval.",
                                  "BenOBD will listen to CAN traffic for about 5 seconds and will not send diagnostic commands during that interval."))
