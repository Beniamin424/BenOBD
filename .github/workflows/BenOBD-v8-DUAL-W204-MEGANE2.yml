              private String deepStage = "";

              private final Runnable obdClock = new Runnable() {
                  @Override public void run() {
                      if (obdScanStartMs <= 0L || obdTimer == null) return;
                      long ms = SystemClock.elapsedRealtime() - obdScanStartMs;
                      obdTimer.setText(t("Procesare scanare: ", "Scan processing: ")
                              + formatDuration(ms)
                              + (obdStage.isEmpty() ? "" : "  •  " + obdStage));
                      main.postDelayed(this, 100);
                  }
              };

              private final Runnable deepClock = new Runnable() {
                  @Override public void run() {
                      if (deepScanStartMs <= 0L || deepTimer == null) return;
                      long ms = SystemClock.elapsedRealtime() - deepScanStartMs;
                      deepTimer.setText(t("Procesare Deep Scan: ", "Deep Scan processing: ")
                              + formatDuration(ms)
                              + (deepStage.isEmpty() ? "" : "  •  " + deepStage));
                      main.postDelayed(this, 100);
                  }
              };
          
              private final Runnable fullLiveTick = new Runnable() {
                  @Override public void run() {
                      if (!allLiveRunning || !isConnected()) return;

                      io.execute(() -> {
                          long cycleStart = SystemClock.elapsedRealtime();
                          try {
                              if (supportedMode01Pids.isEmpty()) {
                                  main.post(() -> {
                                      if (allLiveStatus != null) {
                                          allLiveStatus.setText(t(
                                                  "Detectez toate PID-urile suportate...",
                                                  "Detecting all supported PIDs..."));
                                      }
                                  });
                                  ArrayList<Integer> found = querySupportedMode01Pids();
                                  synchronized (supportedMode01Pids) {
                                      supportedMode01Pids.clear();
                                      supportedMode01Pids.addAll(found);
                                  }
                              }

                              ArrayList<Integer> sweep;
                              synchronized (supportedMode01Pids) {
                                  sweep = new ArrayList<>(supportedMode01Pids);
                              }

                              StringBuilder sb = new StringBuilder();
                              sb.append(t("LIVE TOTAL OBD-II\n", "FULL OBD-II LIVE DATA\n"));
                              sb.append(t("PID suportate: ", "Supported PIDs: "))
                                      .append(sweep.size()).append("\n\n");

                              int ok = 0;
                              int pos = 0;

                              for (Integer pidInt : sweep) {
                                  if (!allLiveRunning) break;
                                  if (pidInt == null) continue;
                                  int pidValue = pidInt;

                                  // Bitmap capability PIDs are not sensor values.
                                  if (pidValue == 0x00 || pidValue == 0x20
                                          || pidValue == 0x40 || pidValue == 0x60
                                          || pidValue == 0x80 || pidValue == 0xA0
                                          || pidValue == 0xC0 || pidValue == 0xE0) {
                                      continue;
                                  }

                                  final int current = ++pos;
                                  final String stage = String.format(
                                          Locale.US, "PID 01%02X • %d/%d",
                                          pidValue, current, sweep.size());
                                  main.post(() -> {
                                      if (allLiveStatus != null) {
                                          long ms = SystemClock.elapsedRealtime()
                                                  - cycleStart;
                                          allLiveStatus.setText(
                                                  t("LIVE TOTAL • ", "FULL LIVE • ")
                                                          + stage + " • "
                                                          + formatDuration(ms));
                                      }
                                  });

                                  String cmd = String.format(
                                          Locale.US, "01%02X", pidValue);
                                  String raw = elm(cmd, 900);

                                  if (!isUseful(raw)) continue;

                                  ok++;
                                  String decoded = decodeAnyMode01Pid(
                                          pidValue, raw);
                                  sb.append("01")
                                          .append(String.format(
                                                  Locale.US, "%02X", pidValue))
                                          .append("  ")
                                          .append(pidName(pidValue))
                                          .append("\n  ")
                                          .append(decoded)
                                          .append("\n\n");
                              }

                              long cycleMs = SystemClock.elapsedRealtime()
                                      - cycleStart;
                              sb.append(t("Valori citite: ", "Values read: "))
                                      .append(ok)
                                      .append("\n")
                                      .append(t("Durata ciclu: ", "Cycle time: "))
                                      .append(formatDuration(cycleMs))
                                      .append("\n")
                                      .append(t(
                                              "Necunoscutele sunt pastrate RAW; BenOBD nu inventeaza formule pentru PID-uri neclare.",
                                              "Unknown values are preserved as RAW; BenOBD never invents formulas for unclear PIDs."));

                              final String report = sb.toString();
                              final int okFinal = ok;
                              final long cycleMsFinal = cycleMs;
                              appendLog("FULL LIVE CYCLE\n" + report);

                              main.post(() -> {
                                  if (allLiveBox != null) {
                                      allLiveBox.setText(report);
                                  }
                                  if (renaultLiveMirror != null) {
                                      renaultLiveMirror.setText(report);
                                  }
                                  if (allLiveStatus != null) {
                                      allLiveStatus.setText(
                                              t("LIVE TOTAL • ciclu ",
                                                      "FULL LIVE • cycle ")
                                                      + formatDuration(cycleMsFinal)
                                                      + " • "
                                                      + okFinal
                                                      + t(" valori", " values"));
                                  }
                              });
                          } catch (Exception e) {
                              appendLog("FULL LIVE ERROR: "
                                      + e.getMessage());
                              main.post(() -> {
                                  if (allLiveStatus != null) {
                                      allLiveStatus.setText(
                                              "FULL LIVE ERROR: "
                                                      + e.getMessage());
                                  }
                              });
                          } finally {
                              if (allLiveRunning) {
                                  main.postDelayed(fullLiveTick, 250);
                              }
                          }
                      });
                  }
              };

              private final Runnable liveTick = new Runnable() {
                  @Override public void run() {
                      if (!liveRunning || !isConnected()) return;
                      io.execute(() -> {
                          try {
                              String rpm = pid("0C", 2, "rpm");
                              String speed = pid("0D", 1, "speed");
                              String coolant = pid("05", 1, "temp");
                              String intake = pid("0F", 1, "temp");
                              String load = pid("04", 1, "percent");
                              String throttle = pid("11", 1, "percent");
                              String maf = pid("10", 2, "maf");
                              String map = pid("0B", 1, "map");
                              String fuel = pid("2F", 1, "percent");
                              String timing = pid("0E", 1, "timing");
                              String moduleV = pid("42", 2, "voltage");
                              String ambient = pid("46", 1, "temp");
                              String baro = pid("33", 1, "map");
                              String runtime = pid("1F", 2, "seconds");
                              String oilTemp = pid("5C", 1, "temp");
                              String fuelRate = pid("5E", 2, "fuelrate");
                              String distClear = pid("31", 2, "distance");
                              String obdStd = pid("1C", 1, "obdstd");
          
                              main.post(() -> {
                                  rpmV.setText(rpm);
                                  speedV.setText(speed);
                                  coolantV.setText(coolant);
                                  intakeV.setText(intake);
                                  loadV.setText(load);
                                  throttleV.setText(throttle);
                                  mafV.setText(maf);
                                  mapV.setText(map);
                                  fuelV.setText(fuel);
                                  timingV.setText(timing);
