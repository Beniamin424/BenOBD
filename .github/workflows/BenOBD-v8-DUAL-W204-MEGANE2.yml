              private ArrayList<Integer> querySupportedMode01Pids()
                      throws Exception {
                  ArrayList<Integer> out = new ArrayList<>();
                  int[] bases = {
                          0x00, 0x20, 0x40, 0x60,
                          0x80, 0xA0, 0xC0, 0xE0
                  };

                  for (int base : bases) {
                      String cmd = String.format(
                              Locale.US, "01%02X", base);
                      String raw = elm(cmd, 1200);
                      int[] map = findPidBytes(
                              raw, 0x41, base, 4);
                      if (map == null) continue;

                      long bits = ((long) map[0] << 24)
                              | ((long) map[1] << 16)
                              | ((long) map[2] << 8)
                              | (long) map[3];

                      for (int i = 0; i < 32; i++) {
                          long mask = 1L << (31 - i);
                          if ((bits & mask) != 0) {
                              int pid = base + i + 1;
                              if (pid >= 0x01 && pid <= 0xFF
                                      && !out.contains(pid)) {
                                  out.add(pid);
                              }
                          }
                      }
                  }

                  Collections.sort(out);
                  return out;
              }

              private int[] mode01Data(
                      String raw, int pid, int maxBytes) {
                  int[] all = hexBytes(raw);

                  for (int i = 0; i + 1 < all.length; i++) {
                      if (all[i] == 0x41
                              && all[i + 1] == pid) {
                          int start = i + 2;
                          int count = 0;

                          while (start + count < all.length
                                  && count < maxBytes) {
                              if (count > 0
                                      && start + count + 1
                                      < all.length
                                      && all[start + count] == 0x41) {
                                  break;
                              }
                              count++;
                          }

                          int[] data = new int[count];
                          for (int j = 0; j < count; j++) {
                              data[j] = all[start + j];
                          }
                          return data;
                      }
                  }

                  return new int[0];
              }

              private String rawBytes(int[] d) {
                  if (d == null || d.length == 0) return "NO DATA";
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < d.length; i++) {
                      if (i > 0) sb.append(" ");
                      sb.append(String.format(
                              Locale.US, "%02X", d[i]));
                  }
                  return sb.toString();
              }

              private String decodeAnyMode01Pid(
                      int pid, String raw) {
                  int[] d = mode01Data(raw, pid, 8);
                  if (d.length == 0) {
                      return "RAW: " + clean(raw);
                  }

                  int a = d.length > 0 ? d[0] : 0;
                  int b = d.length > 1 ? d[1] : 0;
                  int c = d.length > 2 ? d[2] : 0;
                  int e = d.length > 3 ? d[3] : 0;
                  int ab = (a << 8) | b;
                  int cd = (c << 8) | e;

                  try {
                      switch (pid) {
                          case 0x03:
                              return "Fuel system status RAW: "
                                      + rawBytes(d);
                          case 0x04:
                              return String.format(
                                      Locale.US, "%.1f %%", a * 100.0 / 255.0);
                          case 0x05:
                          case 0x0F:
                          case 0x46:
                          case 0x5C:
                              return (a - 40) + " °C";
                          case 0x06:
                          case 0x07:
                          case 0x08:
                          case 0x09:
                          case 0x55:
                          case 0x56:
                          case 0x57:
                          case 0x58:
                              return String.format(
                                      Locale.US, "%.1f %%",
                                      a * 100.0 / 128.0 - 100.0);
                          case 0x0A:
                              return (a * 3) + " kPa";
                          case 0x0B:
                          case 0x33:
                              return a + " kPa";
                          case 0x0C:
                              return String.format(
                                      Locale.US, "%.0f rpm", ab / 4.0);
                          case 0x0D:
                              return a + " km/h";
                          case 0x0E:
                              return String.format(
                                      Locale.US, "%.1f °", a / 2.0 - 64.0);
                          case 0x10:
                              return String.format(
                                      Locale.US, "%.2f g/s", ab / 100.0);
                          case 0x11:
                          case 0x2C:
                          case 0x2E:
                          case 0x2F:
                          case 0x45:
                          case 0x47:
                          case 0x48:
                          case 0x49:
                          case 0x4A:
                          case 0x4B:
                          case 0x4C:
                          case 0x52:
                          case 0x5A:
                          case 0x5B:
                              return String.format(
                                      Locale.US, "%.1f %%", a * 100.0 / 255.0);
                          case 0x14:
                          case 0x15:
                          case 0x16:
                          case 0x17:
                          case 0x18:
                          case 0x19:
                          case 0x1A:
                          case 0x1B:
                              if (d.length >= 2) {
                                  return String.format(
                                          Locale.US,
                                          "O2 %.3f V • trim %.1f %%",
                                          a / 200.0,
                                          b * 100.0 / 128.0 - 100.0);
                              }
                              break;
                          case 0x1F:
                              return formatSeconds(ab);
                          case 0x21:
                          case 0x31:
                              return ab + " km";
                          case 0x22:
                              return String.format(
                                      Locale.US, "%.1f kPa",
                                      ab * 0.079);
                          case 0x23:
                          case 0x59:
                              return (ab * 10) + " kPa";
                          case 0x24:
                          case 0x25:
                          case 0x26:
                          case 0x27:
                          case 0x28:
                          case 0x29:
                          case 0x2A:
                          case 0x2B:
                              if (d.length >= 4) {
                                  return String.format(
                                          Locale.US,
                                          "lambda %.4f • %.3f V",
                                          ab * 2.0 / 65536.0,
                                          cd * 8.0 / 65536.0);
                              }
                              break;
                          case 0x2D:
                              return String.format(
                                      Locale.US, "%.1f %%",
                                      a * 100.0 / 128.0 - 100.0);
                          case 0x30:
                              return a + t(" cicluri", " cycles");
                          case 0x32: {
                              int signed = ab;
                              if ((signed & 0x8000) != 0) {
                                  signed -= 65536;
                              }
                              return String.format(
                                      Locale.US, "%.1f Pa",
                                      signed / 4.0);
                          }
                          case 0x34:
                          case 0x35:
                          case 0x36:
                          case 0x37:
                          case 0x38:
                          case 0x39:
                          case 0x3A:
                          case 0x3B:
                              if (d.length >= 4) {
                                  return String.format(
                                          Locale.US,
                                          "lambda %.4f • current %.3f mA",
                                          ab * 2.0 / 65536.0,
                                          cd / 256.0 - 128.0);
                              }
                              break;
                          case 0x3C:
                          case 0x3D:
                          case 0x3E:
                          case 0x3F:
                              return String.format(
                                      Locale.US, "%.1f °C",
                                      ab / 10.0 - 40.0);
                          case 0x42:
                              return String.format(
                                      Locale.US, "%.3f V",
                                      ab / 1000.0);
                          case 0x43:
                              return String.format(
                                      Locale.US, "%.1f %%",
                                      ab * 100.0 / 255.0);
                          case 0x44:
                              return String.format(
                                      Locale.US, "%.4f",
                                      ab * 2.0 / 65536.0);
                          case 0x4D:
                          case 0x4E:
                              return ab + " min";
                          case 0x51:
                              return fuelTypeName(a)
                                      + " [0x"
                                      + String.format(
                                              Locale.US, "%02X", a)
                                      + "]";
                          case 0x5D:
                              return String.format(
                                      Locale.US, "%.2f °",
                                      (ab - 26880) / 128.0);
                          case 0x5E:
                              return String.format(
                                      Locale.US, "%.2f L/h",
                                      ab * 0.05);
                          case 0x61:
                          case 0x62:
                              return (a - 125) + " %";
                          case 0x63:
                              return ab + " Nm";
                      }
                  } catch (Exception ignored) {}

                  return "RAW: " + rawBytes(d);
              }

              private String formatSeconds(int sec) {
                  int h = sec / 3600;
                  int m = (sec % 3600) / 60;
                  int s = sec % 60;
                  return String.format(
                          Locale.US, "%02d:%02d:%02d",
                          h, m, s);
              }

