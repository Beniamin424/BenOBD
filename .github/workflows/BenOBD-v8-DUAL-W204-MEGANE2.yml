              private JSONObject readProfileFromZip(
                      Uri uri, String entry) throws Exception {
                  InputStream in =
                          getContentResolver().openInputStream(uri);
                  if (in == null) return null;

                  ZipInputStream zis =
                          new ZipInputStream(in);
                  try {
                      ZipEntry ze;
                      String wanted = entry == null
                              ? "" : entry.replace("\\", "/");
                      String wantedJson = wanted
                              .toLowerCase(Locale.ROOT)
                              .endsWith(".json")
                              ? wanted : wanted + ".json";

                      while ((ze = zis.getNextEntry()) != null) {
                          String n = ze.getName()
                                  .replace("\\", "/");
                          boolean match =
                                  n.equals(wanted)
                                  || n.equals(wantedJson)
                                  || n.endsWith("/" + wanted)
                                  || n.endsWith("/" + wantedJson);

                          if (match) {
                              String raw = readText(zis);
                              return new JSONObject(raw);
                          }
                      }
                  } finally {
                      try { zis.close(); } catch (Exception ignored) {}
                  }
                  return null;
              }

              private int getRequestsCount(JSONObject profile) {
                  Object req = profile.opt("requests");
                  if (req instanceof JSONArray) {
                      return ((JSONArray) req).length();
                  }
                  if (req instanceof JSONObject) {
                      return ((JSONObject) req).length();
                  }
                  return 0;
              }

              private ArrayList<JSONObject> getRequestObjects(
                      JSONObject profile) {
                  ArrayList<JSONObject> out =
                          new ArrayList<>();
                  Object req = profile.opt("requests");

                  if (req instanceof JSONArray) {
                      JSONArray a = (JSONArray) req;
                      for (int i = 0; i < a.length(); i++) {
                          JSONObject o = a.optJSONObject(i);
                          if (o != null) out.add(o);
                      }
                  } else if (req instanceof JSONObject) {
                      JSONObject o = (JSONObject) req;
                      JSONArray names = o.names();
                      if (names != null) {
                          for (int i = 0;
                               i < names.length(); i++) {
                              String k =
                                      names.optString(i, "");
                              JSONObject r =
                                      o.optJSONObject(k);
                              if (r != null) {
                                  if (!r.has("name")) {
                                      try {
                                          r.put("name", k);
                                      } catch (Exception ignored) {}
                                  }
                                  out.add(r);
                              }
                          }
                      }
                  }
                  return out;
              }

              private boolean isSafeRenaultRead(
                      JSONObject r) {
                  if (r == null) return false;
                  String name = r.optString(
                          "name", "").toLowerCase(Locale.ROOT);
                  String sent = r.optString(
                          "sentbytes", "")
                          .replace(" ", "")
                          .toUpperCase(Locale.ROOT);

                  if (sent.length() < 2) return false;

                  JSONObject sendItems =
                          r.optJSONObject(
                                  "sendbyte_dataitems");
                  if (sendItems != null
                          && sendItems.length() > 0) {
                      return false;
                  }

                  String[] deny = {
                          "write", "erase", "clear",
                          "reset", "learn", "virgin",
                          "program", "coding", "config",
                          "actuator", "command", "test",
                          "key", "card", "immobil",
                          "isk", "pin", "crash"
                  };
                  for (String d : deny) {
                      if (name.contains(d)) return false;
                  }

                  int sid;
                  try {
                      sid = Integer.parseInt(
                              sent.substring(0, 2), 16);
                  } catch (Exception e) {
                      return false;
                  }

                  return sid == 0x21
                          || sid == 0x22
                          || sid == 0x1A
                          || sid == 0x17
                          || sid == 0x18
                          || sid == 0x19
                          || sid == 0x1C
                          || sid == 0x1E
                          || sid == 0x09;
              }

              private int countRenaultSafeRequests(
                      JSONObject p) {
                  int n = 0;
                  for (JSONObject r :
                          getRequestObjects(p)) {
                      if (isSafeRenaultRead(r)) n++;
                  }
                  return n;
              }

              private boolean looksLikeWriteRequest(
                      JSONObject r) {
                  if (r == null) return false;
                  String name = r.optString(
                          "name", "")
                          .toLowerCase(Locale.ROOT);
                  String sent = r.optString(
                          "sentbytes", "")
                          .replace(" ", "")
                          .toUpperCase(Locale.ROOT);

                  if (sent.length() >= 2) {
                      try {
                          int sid = Integer.parseInt(
                                  sent.substring(0, 2), 16);
                          if (sid == 0x2E
                                  || sid == 0x2F
                                  || sid == 0x31
                                  || sid == 0x3D
                                  || sid == 0x14
                                  || sid == 0x11) {
                              return true;
                          }
                      } catch (Exception ignored) {}
                  }

                  return name.contains("write")
                          || name.contains("config")
                          || name.contains("coding")
                          || name.contains("command")
                          || name.contains("actuator")
                          || name.contains("learn")
                          || name.contains("reset");
              }

              private int countRenaultWriteRequests(
                      JSONObject p) {
                  int n = 0;
                  for (JSONObject r :
                          getRequestObjects(p)) {
                      if (looksLikeWriteRequest(r)) n++;
                  }
                  return n;
              }

              private void renaultReadSafeRequests() {
                  if (!requireConnection()) return;

                  JSONObject p = currentRenaultProfile;
                  if (p == null) {
                      dialog(t("Profil Renault lipseste",
                                      "Renault profile missing"),
                              t("Importa baza si alege un profil ECU X84.",
                                      "Import the database and choose an X84 ECU profile."));
                      return;
                  }

                  if (renaultReadBox != null) {
                      renaultReadBox.setText(t(
                              "Configurez ECU si citesc request-urile SAFE...",
                              "Configuring ECU and reading SAFE requests..."));
                  }

                  io.execute(() -> {
                      try {
                          String setup =
                                  configureRenaultHardware(p);
                          StringBuilder sb =
                                  new StringBuilder();
                          sb.append(setup).append("\n\n");

                          ArrayList<JSONObject> reqs =
                                  getRequestObjects(p);

                          int safe = 0;
                          int ok = 0;
                          int max = 120;

                          for (JSONObject r : reqs) {
                              if (!isSafeRenaultRead(r)) {
                                  continue;
                              }
                              if (safe++ >= max) break;

                              String name = r.optString(
                                      "name", "Read");
                              String cmd = r.optString(
                                      "sentbytes", "")
                                      .replace(" ", "")
                                      .toUpperCase(Locale.ROOT);

                              if (cmd.isEmpty()) continue;

                              String resp = elm(cmd, 1400);
                              String cleaned = clean(resp);

                              sb.append("▶ ")
                                      .append(name)
                                      .append("\n")
                                      .append("  TX ")
                                      .append(cmd)
                                      .append("\n")
                                      .append("  RX ")
                                      .append(cleaned)
                                      .append("\n\n");

                              if (isUseful(resp)) ok++;
                          }

                          sb.append(t("Citiri SAFE incercate: ",
                                  "SAFE reads attempted: "))
                                  .append(safe)
                                  .append("\n")
                                  .append(t("Raspunsuri utile: ",
                                          "Useful responses: "))
                                  .append(ok);

                          final String report =
                                  sb.toString();
                          appendLog("RENAULT SAFE READ\n"
                                  + report);

                          main.post(() -> {
                              if (renaultReadBox != null) {
                                  renaultReadBox.setText(
                                          report);
                              }
                          });
                      } catch (Exception e) {
                          appendLog("RENAULT SAFE READ ERROR: "
                                  + e.getMessage());
                          main.post(() -> {
                              if (renaultReadBox != null) {
                                  renaultReadBox.setText(
                                          "ERROR: "
                                                  + e.getMessage());
                              }
                          });
                      }
                  });
              }

              private String configureRenaultHardware(
                      JSONObject p) throws Exception {
                  JSONObject obd = p.optJSONObject("obd");
                  if (obd == null) {
                      throw new IllegalStateException(
                              "profil fara sectiune obd");
                  }

                  String protocol = obd.optString(
                          "protocol", "")
                          .toUpperCase(Locale.ROOT);
                  String sendId = obd.optString(
                          "send_id", "")
                          .replace("0x", "")
                          .replace(" ", "")
                          .toUpperCase(Locale.ROOT);
                  String recvId = obd.optString(
                          "recv_id", "")
                          .replace("0x", "")
                          .replace(" ", "")
                          .toUpperCase(Locale.ROOT);
                  String funcAddr = obd.optString(
                          "funcaddr", "")
                          .replace("0x", "")
                          .replace(" ", "")
                          .toUpperCase(Locale.ROOT);
                  int baud = obd.optInt("baudrate",
                          500000);

                  StringBuilder log =
                          new StringBuilder();

                  elm("ATE0", 700);
                  elm("ATL0", 700);
                  elm("ATS1", 700);

                  if (protocol.contains("CAN")) {
                      boolean ext = sendId.length() > 3;
                      String sp;
                      if (baud > 0 && baud <= 250000) {
                          sp = ext ? "ATSP9" : "ATSP8";
                      } else {
                          sp = ext ? "ATSP7" : "ATSP6";
                      }

                      log.append(sp).append(": ")
                              .append(clean(elm(sp, 900)))
                              .append("\n");

                      if (!sendId.isEmpty()) {
                          log.append("ATSH ").append(sendId)
                                  .append(": ")
                                  .append(clean(elm(
                                          "ATSH" + sendId,
                                          900)))
                                  .append("\n");
                      }

                      if (!recvId.isEmpty()) {
                          log.append("ATCRA ")
                                  .append(recvId)
                                  .append(": ")
                                  .append(clean(elm(
                                          "ATCRA" + recvId,
                                          900)))
                                  .append("\n");
                      }

                      elm("ATH0", 700);
                      elm("ATAL", 700);
                      elm("ATCAF1", 700);
                      elm("ATCFC1", 700);

                      return t("Profil CAN configurat",
                              "CAN profile configured")
                              + "\n" + log;
                  }

                  if (protocol.contains("KWP")) {
                      log.append("ATSP5: ")
                              .append(clean(elm(
                                      "ATSP5", 1000)))
                              .append("\n");

                      if (funcAddr.length() == 1) {
                          funcAddr = "0" + funcAddr;
                      }
                      if (funcAddr.length() == 2) {
                          String header = "81"
                                  + funcAddr + "F1";
                          log.append("ATSH ")
                                  .append(header)
                                  .append(": ")
                                  .append(clean(elm(
                                          "ATSH" + header,
                                          900)))
                                  .append("\n");
                          log.append("ATFI: ")
                                  .append(clean(elm(
                                          "ATFI", 1500)))
                                  .append("\n");
                      }

                      return t("Profil KWP2000 configurat",
                              "KWP2000 profile configured")
                              + "\n" + log;
                  }

                  throw new IllegalStateException(
                          t("Protocol Renault inca nesuportat direct: ",
                                  "Renault protocol not yet directly supported: ")
                                  + protocol);
              }

