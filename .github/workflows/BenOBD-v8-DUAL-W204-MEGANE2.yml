                  }
              }
          
              private void fullObdScan() {
                  if (!requireConnection()) return;
                  dtcButton.setEnabled(false);
                  startObdClock();

                  io.execute(() -> {
                      StringBuilder report = new StringBuilder();
                      try {
                          long totalStart = SystemClock.elapsedRealtime();

                          setObdStage(t("Erori stocate", "Stored faults"));
                          TimedResponse storedT = timedElm("03", 2200);

                          setObdStage(t("Erori pending", "Pending faults"));
                          TimedResponse pendingT = timedElm("07", 2200);

                          setObdStage(t("Erori permanente", "Permanent faults"));
                          TimedResponse permanentT = timedElm("0A", 2200);

                          setObdStage("Readiness / MIL");
                          TimedResponse readinessT = timedElm("0101", 1600);

                          setObdStage("VIN");
                          TimedResponse vinT = timedElm("0902", 2200);

                          setObdStage("Calibration ID");
                          TimedResponse calT = timedElm("0904", 1800);

                          setObdStage("CVN");
                          TimedResponse cvnT = timedElm("0906", 1800);

                          List<String> stored = parseDtcs(storedT.response, 0x43);
                          List<String> pending = parseDtcs(pendingT.response, 0x47);
                          List<String> permanent = parseDtcs(permanentT.response, 0x4A);

                          report.append(t("STOCATE", "STORED"))
                                  .append("  [").append(formatDuration(storedT.ms)).append("]:\n")
                                  .append(listWithFamily(stored))
                                  .append("\n\nPENDING  [").append(formatDuration(pendingT.ms)).append("]:\n")
                                  .append(listWithFamily(pending))
                                  .append("\n\n")
                                  .append(t("PERMANENTE", "PERMANENT"))
                                  .append("  [").append(formatDuration(permanentT.ms)).append("]:\n")
                                  .append(listWithFamily(permanent))
                                  .append("\n\nREADINESS  [").append(formatDuration(readinessT.ms)).append("]:\n")
                                  .append(clean(readinessT.response))
                                  .append("\n\nVIN  [").append(formatDuration(vinT.ms)).append("]:\n")
                                  .append(clean(vinT.response))
                                  .append("\n\nCAL ID  [").append(formatDuration(calT.ms)).append("]:\n")
                                  .append(clean(calT.response))
                                  .append("\n\nCVN  [").append(formatDuration(cvnT.ms)).append("]:\n")
                                  .append(clean(cvnT.response));

                          setObdStage("Freeze Frame");
                          long ffStart = SystemClock.elapsedRealtime();
                          String freeze = readFreezeFrameInternal();
                          long ffMs = SystemClock.elapsedRealtime() - ffStart;

                          setObdStage("Mode 06");
                          long m6Start = SystemClock.elapsedRealtime();
                          String mode6 = readMode06Internal();
                          long m6Ms = SystemClock.elapsedRealtime() - m6Start;

                          long totalMs = SystemClock.elapsedRealtime() - totalStart;

                          report.append("\n\nFREEZE FRAME  [")
                                  .append(formatDuration(ffMs)).append("]:\n").append(freeze)
                                  .append("\n\nMODE 06  [")
                                  .append(formatDuration(m6Ms)).append("]:\n").append(mode6)
                                  .append("\n\n")
                                  .append(t("TIMP TOTAL SCANARE: ", "TOTAL SCAN TIME: "))
                                  .append(formatDuration(totalMs));

                          currentScanText = report.toString();
                          appendLog("FULL OBD SCAN\n" + currentScanText);
                          stopObdClock(totalMs, true);

                          main.post(() -> {
                              dtcBox.setText(currentScanText);
                              dtcButton.setEnabled(true);
                          });
                      } catch (Exception e) {
                          appendLog("FULL OBD SCAN ERROR: " + e.getMessage());
                          long ms = obdScanStartMs > 0L
                                  ? SystemClock.elapsedRealtime() - obdScanStartMs : 0L;
                          stopObdClock(ms, false);
                          main.post(() -> dtcButton.setEnabled(true));
                      }
                  });
              }

              private void readFreezeFrame() {
                  if (!requireConnection()) return;
                  io.execute(() -> {
                      try {
                          String r = readFreezeFrameInternal();
                          appendLog("FREEZE FRAME\n" + r);
                          main.post(() -> dtcBox.setText(r));
                      } catch (Exception e) {
                          appendLog("FREEZE FRAME ERROR: " + e.getMessage());
                      }
                  });
              }
          
              private String readFreezeFrameInternal() throws Exception {
                  StringBuilder sb = new StringBuilder();
                  String[] cmds = {
                          "020000", "020200", "020400", "020500", "020B00", "020C00",
                          "020D00", "020F00", "021000", "021100", "023300", "024200",
                          "024600", "025C00", "025E00"
                  };
                  for (String c : cmds) {
                      String r = elm(c, 1200);
                      if (isUseful(r)) sb.append(c).append(": ").append(clean(r)).append("\n");
                  }
                  if (sb.length() == 0) return t("Fara Freeze Frame disponibil.", "No Freeze Frame available.");
                  return sb.toString().trim();
              }
          
              private void readMode06() {
                  if (!requireConnection()) return;
                  io.execute(() -> {
                      try {
                          String r = readMode06Internal();
                          appendLog("MODE 06\n" + r);
                          main.post(() -> dtcBox.setText(r));
                      } catch (Exception e) {
                          appendLog("MODE 06 ERROR: " + e.getMessage());
                      }
                  });
              }
          
              private String readMode06Internal() throws Exception {
                  StringBuilder sb = new StringBuilder();
                  String[] cmds = {"0600", "0620", "0640", "0660", "0680", "06A0", "06C0"};
                  for (String c : cmds) {
                      String r = elm(c, 1600);
                      if (isUseful(r)) sb.append(c).append(": ").append(clean(r)).append("\n");
                  }
                  if (sb.length() == 0) return t("Mode 06 indisponibil.", "Mode 06 unavailable.");
                  return sb.toString().trim();
              }
          
              private void readReadiness() {
                  if (!requireConnection()) return;
                  io.execute(() -> {
                      try {
                          String raw = elm("0101", 1400);
                          int[] data = findPidBytes(raw, 0x41, 0x01, 4);
                          String text;
                          if (data == null) {
                              text = t("ECU nu a returnat status readiness.",
                                      "ECU did not return readiness status.");
                          } else {
                              boolean mil = (data[0] & 0x80) != 0;
                              int count = data[0] & 0x7F;
                              text = "Check Engine/MIL: " + (mil ? "ON" : "OFF")
                                      + "\n" + t("Numar DTC raportat de ECU: ",
                                      "DTC count reported by ECU: ") + count
                                      + "\nRAW: " + clean(raw);
                          }
                          appendLog("READINESS\n" + text);
                          String finalText = text;
                          main.post(() -> dtcBox.setText(finalText));
                      } catch (Exception e) {
                          appendLog("READINESS ERROR: " + e.getMessage());
                      }
                  });
              }
          
