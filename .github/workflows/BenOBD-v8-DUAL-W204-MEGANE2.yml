              private String udsStatusExplanation(int s) {
                  ArrayList<String> x = new ArrayList<>();
                  if ((s & 0x01) != 0) x.add(t(
                          "defect detectat acum", "fault detected now"));
                  if ((s & 0x02) != 0) x.add(t(
                          "a esuat in ciclul curent de contact",
                          "failed during the current ignition cycle"));
                  if ((s & 0x04) != 0) x.add(t(
                          "pending: observat, dar nu complet confirmat",
                          "pending: observed, not fully confirmed"));
                  if ((s & 0x08) != 0) x.add(t(
                          "confirmat si memorat in modul",
                          "confirmed and stored in the module"));
                  if ((s & 0x10) != 0) x.add(t(
                          "test nefinalizat de la ultima stergere",
                          "test not completed since last clear"));
                  if ((s & 0x20) != 0) x.add(t(
                          "a aparut cel putin o data de la ultima stergere",
                          "occurred at least once since last clear"));
                  if ((s & 0x40) != 0) x.add(t(
                          "test nefinalizat in ciclul curent",
                          "test not completed this cycle"));
                  if ((s & 0x80) != 0) x.add(t(
                          "modulul solicita un martor/avertizare",
                          "module requests a warning indicator"));
                  if (x.isEmpty()) return t(
                          "niciun flag activ in status",
                          "no active status flags");
                  return join(x, "; ");
              }

