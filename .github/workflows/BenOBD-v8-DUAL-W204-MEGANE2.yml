              private void deepUdsScan() {
                  if (!requireConnection()) return;
                  deepButton.setEnabled(false);
                  startDeepClock();
          
                  new AlertDialog.Builder(this)
                          .setTitle(t("Mercedes Deep Scan", "Mercedes Deep Scan"))
                          .setMessage(t(
                                  "Scanarea foloseste numai cereri de citire pe CAN si poate dura cateva minute. Nu face coding si nu actioneaza componente. Continui?",
                                  "The scan uses read-only CAN requests and may take a few minutes. It does not code modules or actuate components. Continue?"))
                          .setNegativeButton(t("Anuleaza", "Cancel"), (d, w) -> {
                              deepButton.setEnabled(true);
                              stopDeepClock(0L, false);
                          })
                          .setPositiveButton(t("Scaneaza", "Scan"), (d, w) -> io.execute(() -> {
                              try {
                                  long totalStart = SystemClock.elapsedRealtime();
                                  String report = runDeepUdsScanInternal();
                                  long totalMs = SystemClock.elapsedRealtime() - totalStart;
                                  final String finalReport = report + "\n\n"
                                          + t("TIMP TOTAL DEEP SCAN: ", "TOTAL DEEP SCAN TIME: ")
                                          + formatDuration(totalMs);
                                  latestUdsReport = finalReport;
                                  currentScanText = currentScanText + "\n\n" + finalReport;
                                  appendLog("MERCEDES DEEP SCAN\n" + finalReport);
                                  stopDeepClock(totalMs, true);
                                  main.post(() -> {
                                      deepBox.setText(finalReport);
                                      deepButton.setEnabled(true);
                                  });
                              } catch (Exception e) {
                                  appendLog("DEEP SCAN ERROR: " + e.getMessage());
                                  long ms = deepScanStartMs > 0L
                                          ? SystemClock.elapsedRealtime() - deepScanStartMs : 0L;
                                  stopDeepClock(ms, false);
                                  try { initElm(); } catch (Exception ignored) {}
                                  main.post(() -> deepButton.setEnabled(true));
                              }
                          })).show();
              }
          
              private String runDeepUdsScanInternal() throws Exception {
                  StringBuilder report = new StringBuilder();
                  moduleIdentities.clear();
                  elm("ATSP6", 1300);
                  elm("ATH1", 800);
                  elm("ATS1", 800);
                  elm("ATAL", 800);
                  elm("ATCAF1", 800);
                  elm("ATCFC1", 800);
          
                  int found = 0;
          
                  for (int tx = 0x7E0; tx <= 0x7E7; tx++) {
                      int rx = tx + 8;
                      String txs = String.format(Locale.US, "%03X", tx);
                      String rxs = String.format(Locale.US, "%03X", rx);
                      setDeepStage("ECU " + txs + " -> " + rxs);
          
                      setCanHeader(txs, rxs);
          
                      String tester = elm("3E00", 700);
                      String obdProbe = elm("0100", 900);
          
                      if (!isUseful(tester) && !isUseful(obdProbe)) {
                          continue;
                      }
          
                      found++;
                      report.append("\n=== ECU ").append(txs).append(" -> ").append(rxs).append(" ===\n");
          
                      if (isUseful(tester)) report.append("TesterPresent: ").append(clean(tester)).append("\n");
                      if (isUseful(obdProbe)) report.append("OBD Probe: ").append(clean(obdProbe)).append("\n");
          
                      StringBuilder identityRaw = new StringBuilder();
                      String[] idDids = {
                              "22F190", "22F187", "22F189", "22F18A", "22F18C"
                      };
                      for (String q : idDids) {
                          String r = elm(q, 1400);
                          if (isUseful(r)) {
                              String cr = clean(r);
                              report.append(q).append(": ")
                                      .append(cr).append(nrcSuffix(r)).append("\n");
                              identityRaw.append(q).append("=")
                                      .append(cr).append(" | ");
                          }
                      }
                      registerDetectedModule(txs, rxs, identityRaw.toString());
          
                      String count = elm("1901FF", 1400);
                      if (isUseful(count)) {
                          report.append("DTC Count/Format: ")
                                  .append(clean(count)).append(nrcSuffix(count)).append("\n");
                      }
          
                      String all = elm("1902FF", 2000);
                      if (isUseful(all)) {
                          report.append("DTC by status mask:\n")
                                  .append(formatUdsDtcResponse(all)).append("\n");
                      }
          
                      String supported = elm("190A", 1800);
                      if (isUseful(supported)) {
                          report.append("Supported DTC:\n")
                                  .append(formatUdsDtcResponse(supported)).append("\n");
                      }
          
                      String firstFailed = elm("190B", 1300);
                      if (isUseful(firstFailed)) {
                          report.append("First test failed: ")
                                  .append(clean(firstFailed)).append(nrcSuffix(firstFailed)).append("\n");
                      }
          
                      String firstConfirmed = elm("190C", 1300);
                      if (isUseful(firstConfirmed)) {
                          report.append("First confirmed: ")
                                  .append(clean(firstConfirmed)).append(nrcSuffix(firstConfirmed)).append("\n");
                      }
          
                      String recentFailed = elm("190D", 1300);
                      if (isUseful(recentFailed)) {
                          report.append("Most recent failed: ")
                                  .append(clean(recentFailed)).append(nrcSuffix(recentFailed)).append("\n");
                      }
          
                      String recentConfirmed = elm("190E", 1300);
                      if (isUseful(recentConfirmed)) {
                          report.append("Most recent confirmed: ")
                                  .append(clean(recentConfirmed)).append(nrcSuffix(recentConfirmed)).append("\n");
                      }
          
                      String mirror = elm("190FFF", 1600);
                      if (isUseful(mirror)) {
                          report.append("Mirror memory:\n")
                                  .append(formatUdsDtcResponse(mirror)).append("\n");
                      }
          
                      String fdc = elm("1914", 1500);
                      if (isUseful(fdc)) {
                          report.append("Fault detection counters: ")
                                  .append(clean(fdc)).append(nrcSuffix(fdc)).append("\n");
                      }
          
                      String permanent = elm("1915", 1500);
                      if (isUseful(permanent)) {
                          report.append("Permanent-status DTC:\n")
                                  .append(formatUdsDtcResponse(permanent)).append("\n");
                      }
          
                      List<String> dtcs = extractUdsDtcs(all);
                      int limit = Math.min(dtcs.size(), 8);
                      for (int i = 0; i < limit; i++) {
                          String dtc = dtcs.get(i);
                          setDeepStage("ECU " + txs + " / DTC " + dtc);
          
                          String sev = elm("1909" + dtc, 1400);
                          if (isUseful(sev)) {
                              report.append("Severity ").append(dtc).append(": ")
                                      .append(clean(sev)).append(nrcSuffix(sev)).append("\n");
                          }
          
                          String snap = elm("1904" + dtc + "FF", 1700);
                          if (isUseful(snap)) {
                              report.append("Snapshot ").append(dtc).append(": ")
                                      .append(clean(snap)).append(nrcSuffix(snap)).append("\n");
                          }
          
                          String ext = elm("1906" + dtc + "FF", 1700);
                          if (isUseful(ext)) {
                              report.append("ExtendedData ").append(dtc).append(": ")
                                      .append(clean(ext)).append(nrcSuffix(ext)).append("\n");
                          }
                      }
                  }
          
                  try { initElm(); } catch (Exception e) {
                      report.append("\nELM re-init warning: ").append(e.getMessage()).append("\n");
                  }
          
                  if (found == 0) {
                      report.append(t(
                              "Nu a raspuns niciun ECU pe 7E0-7E7. Asta nu inseamna ca masina nu are erori: unele module W204 folosesc alte adrese/protocoale sau gateway Mercedes.",
                              "No ECU responded on 7E0-7E7. This does not mean the vehicle has no faults: some W204 modules use different addresses/protocols or the Mercedes gateway."));
                  } else {
                      report.insert(0, t("Module CAN detectate: ", "Detected CAN modules: ") + found + "\n");
                  }
                  final String profileReport = buildModuleProfileReport();
                  main.post(() -> {
                      if (moduleProfileBox != null) {
                          moduleProfileBox.setText(profileReport);
                      }
                      refreshActivationProfileBadges();
                  });

                  return report.toString().trim();
              }

