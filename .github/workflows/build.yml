              private String runDeepUdsScanInternal() throws Exception {
                  StringBuilder report = new StringBuilder();
                  elm("ATSP6", 1300);
                  elm("ATH1", 800);
                  elm("ATS1", 800);
                  elm("ATAL", 800);
                  elm("ATCAF1", 800);
                  elm("ATCFC1", 800);
          
                  int found = 0;
          
                  for (int tx = 0x7E0; tx <= 0x7E7; tx++) {
                      int rx = tx + 8;
                      String txs = String.format(Locale.US, "%03X", tx);
                      String rxs = String.format(Locale.US, "%03X", rx);
          
                      setCanHeader(txs, rxs);
          
                      String tester = elm("3E00", 700);
                      String obdProbe = elm("0100", 900);
          
                      if (!isUseful(tester) && !isUseful(obdProbe)) {
                          continue;
                      }
          
                      found++;
                      report.append("\n=== ECU ").append(txs).append(" -> ").append(rxs).append(" ===\n");
          
                      if (isUseful(tester)) report.append("TesterPresent: ").append(clean(tester)).append("\n");
                      if (isUseful(obdProbe)) report.append("OBD Probe: ").append(clean(obdProbe)).append("\n");
          
                      String[] idDids = {
                              "22F190", "22F187", "22F189", "22F18A", "22F18C"
                      };
                      for (String q : idDids) {
                          String r = elm(q, 1400);
                          if (isUseful(r)) {
                              report.append(q).append(": ")
                                      .append(clean(r)).append(nrcSuffix(r)).append("\n");
                          }
                      }
          
                      String count = elm("1901FF", 1400);
                      if (isUseful(count)) {
                          report.append("DTC Count/Format: ")
                                  .append(clean(count)).append(nrcSuffix(count)).append("\n");
                      }
          
                      String all = elm("1902FF", 2000);
                      if (isUseful(all)) {
                          report.append("DTC by status mask:\n")
                                  .append(formatUdsDtcResponse(all)).append("\n");
                      }
          
                      String supported = elm("190A", 1800);
                      if (isUseful(supported)) {
                          report.append("Supported DTC:\n")
                                  .append(formatUdsDtcResponse(supported)).append("\n");
                      }
          
                      String firstFailed = elm("190B", 1300);
                      if (isUseful(firstFailed)) {
                          report.append("First test failed: ")
                                  .append(clean(firstFailed)).append(nrcSuffix(firstFailed)).append("\n");
                      }
          
                      String firstConfirmed = elm("190C", 1300);
                      if (isUseful(firstConfirmed)) {
                          report.append("First confirmed: ")
                                  .append(clean(firstConfirmed)).append(nrcSuffix(firstConfirmed)).append("\n");
                      }
          
                      String recentFailed = elm("190D", 1300);
                      if (isUseful(recentFailed)) {
                          report.append("Most recent failed: ")
                                  .append(clean(recentFailed)).append(nrcSuffix(recentFailed)).append("\n");
                      }
          
                      String recentConfirmed = elm("190E", 1300);
                      if (isUseful(recentConfirmed)) {
                          report.append("Most recent confirmed: ")
                                  .append(clean(recentConfirmed)).append(nrcSuffix(recentConfirmed)).append("\n");
                      }
          
                      String mirror = elm("190FFF", 1600);
                      if (isUseful(mirror)) {
                          report.append("Mirror memory:\n")
                                  .append(formatUdsDtcResponse(mirror)).append("\n");
                      }
          
                      String fdc = elm("1914", 1500);
                      if (isUseful(fdc)) {
                          report.append("Fault detection counters: ")
                                  .append(clean(fdc)).append(nrcSuffix(fdc)).append("\n");
                      }
          
                      String permanent = elm("1915", 1500);
                      if (isUseful(permanent)) {
                          report.append("Permanent-status DTC:\n")
                                  .append(formatUdsDtcResponse(permanent)).append("\n");
                      }
          
                      List<String> dtcs = extractUdsDtcs(all);
                      int limit = Math.min(dtcs.size(), 8);
                      for (int i = 0; i < limit; i++) {
                          String dtc = dtcs.get(i);
          
                          String sev = elm("1909" + dtc, 1400);
                          if (isUseful(sev)) {
                              report.append("Severity ").append(dtc).append(": ")
                                      .append(clean(sev)).append(nrcSuffix(sev)).append("\n");
                          }
          
                          String snap = elm("1904" + dtc + "FF", 1700);
                          if (isUseful(snap)) {
                              report.append("Snapshot ").append(dtc).append(": ")
                                      .append(clean(snap)).append(nrcSuffix(snap)).append("\n");
                          }
          
                          String ext = elm("1906" + dtc + "FF", 1700);
                          if (isUseful(ext)) {
                              report.append("ExtendedData ").append(dtc).append(": ")
                                      .append(clean(ext)).append(nrcSuffix(ext)).append("\n");
                          }
                      }
                  }
          
                  try { initElm(); } catch (Exception e) {
                      report.append("\nELM re-init warning: ").append(e.getMessage()).append("\n");
                  }
          
                  if (found == 0) {
                      report.append(t(
                              "Nu a raspuns niciun ECU pe 7E0-7E7. Asta nu inseamna ca masina nu are erori: unele module W204 folosesc alte adrese/protocoale sau gateway Mercedes.",
                              "No ECU responded on 7E0-7E7. This does not mean the vehicle has no faults: some W204 modules use different addresses/protocols or the Mercedes gateway."));
                  } else {
                      report.insert(0, t("Module CAN detectate: ", "Detected CAN modules: ") + found + "\n");
                  }
          
                  return report.toString().trim();
              }
          
              private void setCanHeader(String tx, String rx) throws Exception {
                  elm("ATSH" + tx, 700);
                  String r = elm("ATCRA" + rx, 700);
                  if (!isUseful(r) && clean(r).contains("?")) {
                      appendLog("ATCRA not supported by adapter: " + clean(r));
                  }
              }
          
              private String formatUdsDtcResponse(String raw) {
                  String nrc = nrcSuffix(raw);
                  if (!nrc.isEmpty()) return clean(raw) + nrc;
          
                  int[] b = hexBytes(raw);
                  int start = -1;
                  for (int i = 0; i + 2 < b.length; i++) {
                      if (b[i] == 0x59 &&
                              (b[i + 1] == 0x02 || b[i + 1] == 0x0A
                                      || b[i + 1] == 0x0F || b[i + 1] == 0x15)) {
                          start = i + 2;
                          break;
                      }
                  }
                  if (start < 0) return clean(raw);
          
                  StringBuilder sb = new StringBuilder();
                  int idx = start;
          
                  if (idx < b.length) {
                      int availability = b[idx++];
                      sb.append("StatusAvailabilityMask=0x")
                              .append(String.format(Locale.US, "%02X", availability)).append("\n");
                  }
          
                  while (idx + 3 < b.length) {
                      String dtc = String.format(Locale.US, "%02X%02X%02X",
                              b[idx], b[idx + 1], b[idx + 2]);
                      int statusByte = b[idx + 3];
                      sb.append("• UDS ").append(dtc)
                              .append("  status=0x")
                              .append(String.format(Locale.US, "%02X", statusByte))
                              .append("  ").append(decodeDtcStatus(statusByte))
                              .append("\n");
                      idx += 4;
                  }
          
                  if (sb.length() == 0) return clean(raw);
                  return sb.toString().trim();
              }
          
              private List<String> extractUdsDtcs(String raw) {
                  int[] b = hexBytes(raw);
                  ArrayList<String> out = new ArrayList<>();
                  int start = -1;
                  for (int i = 0; i + 2 < b.length; i++) {
                      if (b[i] == 0x59 && b[i + 1] == 0x02) {
                          start = i + 3;
                          break;
                      }
                  }
                  if (start < 0) return out;
          
                  for (int i = start; i + 3 < b.length; i += 4) {
                      out.add(String.format(Locale.US, "%02X%02X%02X",
                              b[i], b[i + 1], b[i + 2]));
                  }
                  return out;
              }
          
              private String decodeDtcStatus(int s) {
                  ArrayList<String> f = new ArrayList<>();
                  if ((s & 0x01) != 0) f.add("testFailed");
                  if ((s & 0x02) != 0) f.add("failedThisCycle");
                  if ((s & 0x04) != 0) f.add("pending");
                  if ((s & 0x08) != 0) f.add("confirmed");
                  if ((s & 0x10) != 0) f.add("notCompletedSinceClear");
                  if ((s & 0x20) != 0) f.add("failedSinceClear");
                  if ((s & 0x40) != 0) f.add("notCompletedThisCycle");
                  if ((s & 0x80) != 0) f.add("warningRequested");
                  if (f.isEmpty()) return "no status flags";
                  return join(f, ", ");
              }
          
              private void passiveCanMonitor() {
                  if (!requireConnection()) return;
          
                  new AlertDialog.Builder(this)
                          .setTitle(t("Monitor CAN pasiv", "Passive CAN monitor"))
                          .setMessage(t(
                                  "BenOBD va asculta traficul CAN aproximativ 5 secunde si nu va transmite comenzi de diagnoza in acest interval.",
                                  "BenOBD will listen to CAN traffic for about 5 seconds and will not send diagnostic commands during that interval."))
                          .setNegativeButton(t("Anuleaza", "Cancel"), null)
                          .setPositiveButton("OK", (d, w) -> io.execute(() -> {
                              try {
                                  elm("ATSP6", 1200);
                                  elm("ATH1", 700);
                                  elm("ATS1", 700);
          
                                  while (input.available() > 0) input.read();
                                  output.write("ATMA\r".getBytes(StandardCharsets.US_ASCII));
                                  output.flush();
          
                                  long end = System.currentTimeMillis() + 5000;
                                  StringBuilder sb = new StringBuilder();
          
                                  while (System.currentTimeMillis() < end) {
                                      while (input.available() > 0) {
                                          int v = input.read();
                                          if (v < 0) break;
                                          char c = (char) v;
                                          if (c != '>') sb.append(c);
                                          if (sb.length() > 15000) {
                                              sb.delete(0, sb.length() - 15000);
                                          }
                                      }
                                      Thread.sleep(20);
                                  }
          
                                  output.write("\r".getBytes(StandardCharsets.US_ASCII));
                                  output.flush();
                                  Thread.sleep(300);
          
                                  appendLog("PASSIVE CAN MONITOR 5s\n" + sb.toString().trim());
                                  try { initElm(); } catch (Exception ignored) {}
          
                                  String view = sb.length() > 6000
                                          ? sb.substring(sb.length() - 6000)
                                          : sb.toString();
          
                                  main.post(() -> deepBox.setText(view.trim()));
                              } catch (Exception e) {
                                  appendLog("CAN MONITOR ERROR: " + e.getMessage());
                                  try { initElm(); } catch (Exception ignored) {}
                              }
                          })).show();
              }
          
              private void expertReadOnlyCommand() {
                  if (!requireConnection()) return;
          
                  String tx = sanitizeHex(expertTx.getText().toString());
                  String rx = sanitizeHex(expertRx.getText().toString());
                  String cmd = sanitizeHex(expertCmd.getText().toString());
          
                  if (!(tx.length() == 3 || tx.length() == 8)
                          || !(rx.length() == 3 || rx.length() == 8)
                          || cmd.length() < 2) {
                      dialog(t("Date invalide", "Invalid data"),
                              t("Foloseste CAN ID de 3 sau 8 caractere HEX si o comanda HEX valida.",
                                      "Use a 3 or 8 character HEX CAN ID and a valid HEX command."));
                      return;
                  }
          
                  if (!isReadOnlyService(cmd)) {
                      dialog(t("Comanda blocata", "Command blocked"),
                              t("Serviciul nu este in lista Read-Only. Coding, SecurityAccess, RoutineControl, IOControl, flashing si CommunicationControl sunt blocate in terminal.",
                                      "This service is not on the Read-Only allowlist. Coding, SecurityAccess, RoutineControl, IOControl, flashing and CommunicationControl are blocked in the terminal."));
                      return;
                  }
          
                  io.execute(() -> {
                      try {
                          elm("ATSP6", 1200);
                          elm("ATH1", 700);
                          elm("ATAL", 700);
                          elm("ATCAF1", 700);
          
                          elm("ATSH" + tx, 700);
                          elm("ATCRA" + rx, 700);
          
                          String r = elm(cmd, 2400);
                          String formatted = "TX " + tx + " / RX " + rx
                                  + "\nREQ: " + cmd
                                  + "\nRES: " + clean(r)
                                  + nrcSuffix(r);
          
                          appendLog("EXPERT READ-ONLY\n" + formatted);
                          main.post(() -> deepBox.setText(formatted));
          
                          try { initElm(); } catch (Exception ignored) {}
                      } catch (Exception e) {
                          appendLog("EXPERT READ ERROR: " + e.getMessage());
                          try { initElm(); } catch (Exception ignored) {}
                      }
                  });
              }
          
              private boolean isReadOnlyService(String cmd) {
                  if (cmd.length() < 2) return false;
                  String svc = cmd.substring(0, 2);
                  return Arrays.asList(
                          "01", "02", "03", "06", "07", "09", "0A",
                          "18", "19", "1A", "21", "22", "3E"
                  ).contains(svc);
              }
          
              private void confirmUdsClear() {
                  if (!requireConnection()) return;
          
                  String tx = sanitizeHex(expertTx.getText().toString());
                  String rx = sanitizeHex(expertRx.getText().toString());
          
                  new AlertDialog.Builder(this)
                          .setTitle(t("Stergere memorie DTC UDS", "Clear UDS DTC memory"))
                          .setMessage(t(
                                  "Aceasta trimite 14FFFFFF catre modulul selectat si poate sterge istoricul de diagnoza din acel modul. Nu modifica coding-ul, dar poate elimina informatii utile pentru diagnostic. Continui?",
                                  "This sends 14FFFFFF to the selected module and may erase diagnostic history in that module. It does not change coding, but can remove useful diagnostic evidence. Continue?"))
                          .setNegativeButton(t("Anuleaza", "Cancel"), null)
                          .setPositiveButton(t("Sterge", "Clear"), (d, w) -> io.execute(() -> {
                              try {
                                  elm("ATSP6", 1200);
                                  elm("ATH1", 700);
                                  elm("ATAL", 700);
                                  elm("ATCAF1", 700);
                                  elm("ATSH" + tx, 700);
                                  elm("ATCRA" + rx, 700);
          
                                  String r = elm("14FFFFFF", 2200);
                                  appendLog("UDS CLEAR " + tx + "/" + rx + ": " + clean(r) + nrcSuffix(r));
                                  String text = t("Raspuns stergere UDS: ", "UDS clear response: ")
                                          + clean(r) + nrcSuffix(r);
          
                                  main.post(() -> deepBox.setText(text));
                                  try { initElm(); } catch (Exception ignored) {}
                              } catch (Exception e) {
                                  appendLog("UDS CLEAR ERROR: " + e.getMessage());
                                  try { initElm(); } catch (Exception ignored) {}
                              }
                          })).show();
              }
          
              private void confirmClear() {
                  if (!requireConnection()) return;
          
                  new AlertDialog.Builder(this)
                          .setTitle(t("Stergere erori OBD", "Clear OBD trouble codes"))
                          .setMessage(t(
                                  "Comanda OBD Mode 04 sterge erorile de emisii si poate reseta Freeze Frame/readiness. Motorul trebuie sa fie oprit, contactul pus. Continui?",
                                  "OBD Mode 04 clears emissions DTCs and may reset Freeze Frame/readiness. Engine should be off, ignition on. Continue?"))
                          .setNegativeButton(t("Anuleaza", "Cancel"), null)
                          .setPositiveButton(t("Sterge", "Clear"), (d, w) -> clearDtcs())
                          .show();
              }
          
              private void clearDtcs() {
                  clearButton.setEnabled(false);
                  io.execute(() -> {
                      try {
                          String response = elm("04", 1800);
                          appendLog("CLEAR DTC RESPONSE: " + clean(response));
          
                          String verify = elm("03", 1800);
                          List<String> remain = parseDtcs(verify, 0x43);
          
                          String text = t("Raspuns stergere: ", "Clear response: ")
                                  + clean(response)
                                  + "\n\n" + t("Erori ramase: ", "Remaining codes: ")
                                  + listWithFamily(remain);
          
                          main.post(() -> {
                              dtcBox.setText(text);
                              clearButton.setEnabled(true);
                          });
                      } catch (Exception e) {
                          appendLog("CLEAR ERROR: " + e.getMessage());
                          main.post(() -> clearButton.setEnabled(true));
                      }
                  });
              }
          
              private void saveSnapshot() {
                  String snapshot = currentScanText;
                  if (snapshot == null || snapshot.trim().isEmpty()) {
                      snapshot = dtcBox == null ? "" : dtcBox.getText().toString();
                  }
                  prefs.edit()
                          .putString("previous_scan", snapshot)
                          .putLong("previous_scan_time", System.currentTimeMillis())
                          .apply();
                  toast(t("Scanarea a fost salvata.", "Scan snapshot saved."));
              }
          
              private void compareWithPrevious() {
                  String prev = prefs.getString("previous_scan", "");
                  String cur = currentScanText == null ? "" : currentScanText;
          
                  if (prev.trim().isEmpty()) {
                      dialog(t("Fara istoric", "No history"),
                              t("Salveaza mai intai o scanare.", "Save a scan snapshot first."));
                      return;
                  }
          
                  Set<String> oldCodes = extractAllCodes(prev);
                  Set<String> newCodes = extractAllCodes(cur);
          
                  Set<String> appeared = new HashSet<>(newCodes);
                  appeared.removeAll(oldCodes);
          
                  Set<String> gone = new HashSet<>(oldCodes);
                  gone.removeAll(newCodes);
          
                  Set<String> same = new HashSet<>(newCodes);
                  same.retainAll(oldCodes);
          
                  String text = t("ERORI NOI", "NEW FAULTS") + ":\n" + setOrNone(appeared)
                          + "\n\n" + t("DISPARUTE", "CLEARED/GONE") + ":\n" + setOrNone(gone)
                          + "\n\n" + t("RAMASE", "STILL PRESENT") + ":\n" + setOrNone(same);
          
                  deepBox.setText(text);
              }
          
              private Set<String> extractAllCodes(String s) {
                  HashSet<String> out = new HashSet<>();
                  if (s == null) return out;
          
                  Matcher m1 = Pattern.compile("\\b[PCBU][0-3][0-9A-F]{3}\\b",
                          Pattern.CASE_INSENSITIVE).matcher(s);
                  while (m1.find()) out.add(m1.group().toUpperCase(Locale.ROOT));
          
                  Matcher m2 = Pattern.compile("\\bUDS\\s+([0-9A-F]{6})\\b",
                          Pattern.CASE_INSENSITIVE).matcher(s);
                  while (m2.find()) out.add("UDS " + m2.group(1).toUpperCase(Locale.ROOT));
          
                  return out;
              }
          
              private String setOrNone(Set<String> s) {
                  if (s.isEmpty()) return t("Niciuna", "None");
                  ArrayList<String> sorted = new ArrayList<>(s);
                  Collections.sort(sorted);
                  StringBuilder sb = new StringBuilder();
                  for (String x : sorted) sb.append("• ").append(x).append("\n");
                  return sb.toString().trim();
              }
          
              private void addCodingSwitch(String key, String name) {
                  Switch s = makeSwitch(name,
                          t("Activare Mercedes specifica. Necesita profil verificat pentru modulul detectat.",
                                  "Mercedes-specific activation. Requires a verified profile for the detected module."));
          
                  s.setOnCheckedChangeListener((buttonView, checked) -> {
                      if (!buttonView.isPressed()) return;
                      buttonView.setChecked(!checked);
          
                      if (!requireConnection()) return;
          
                      if (!forceMode) {
                          dialog("Safe Mode",
                                  t("Activeaza Force Mode pentru codari de confort.",
                                          "Enable Force Mode for comfort coding."));
                          return;
                      }
          
                      dialog(t("Profil Mercedes necesar", "Mercedes profile required"),
                              t("BenOBD nu inventeaza payload-uri de coding. Pentru " + name
                                              + " trebuie identificat modulul si incarcata o secventa Mercedes verificata. "
                                              + "Diagnoza Deep Scan ramane complet Read-Only.",
                                      "BenOBD does not invent coding payloads. For " + name
                                              + " the module must be identified and a verified Mercedes sequence loaded. "
                                              + "Deep Scan remains fully Read-Only."));
                  });
          
                  root.addView(s, smallGap());
              }
          
              private String pid(String pid, int bytes, String type) throws Exception {
                  String raw = elm("01" + pid, 1100);
                  int[] d = findPidBytes(raw, 0x41, Integer.parseInt(pid, 16), bytes);
                  if (d == null) return "--";
          
                  switch (type) {
                      case "rpm":
                          return String.format(Locale.US, "%.0f rpm",
                                  ((d[0] * 256) + d[1]) / 4.0);
                      case "speed":
                          return d[0] + " km/h";
                      case "temp":
                          return (d[0] - 40) + " °C";
                      case "percent":
                          return String.format(Locale.US, "%.0f %%",
                                  d[0] * 100.0 / 255.0);
                      case "maf":
                          return String.format(Locale.US, "%.2f g/s",
                                  ((d[0] * 256) + d[1]) / 100.0);
                      case "map":
                          return d[0] + " kPa";
                      case "timing":
                          return String.format(Locale.US, "%.1f °",
                                  d[0] / 2.0 - 64.0);
                      case "voltage":
                          return String.format(Locale.US, "%.2f V",
                                  ((d[0] * 256) + d[1]) / 1000.0);
                      case "seconds": {
                          int sec = d[0] * 256 + d[1];
                          int h = sec / 3600;
                          int m = (sec % 3600) / 60;
                          return h + "h " + m + "m";
                      }
                      case "fuelrate":
                          return String.format(Locale.US, "%.2f L/h",
                                  ((d[0] * 256) + d[1]) * 0.05);
                      case "distance":
                          return (d[0] * 256 + d[1]) + " km";
                      case "obdstd":
                          return "0x" + String.format(Locale.US, "%02X", d[0]);
                      default:
                          return "--";
                  }
              }
          
              private int[] findPidBytes(String raw, int mode, int pid, int count) {
                  int[] bytes = hexBytes(raw);
                  for (int i = 0; i < bytes.length - (count + 1); i++) {
                      if (bytes[i] == mode && bytes[i + 1] == pid) {
                          int[] out = new int[count];
                          for (int j = 0; j < count; j++) out[j] = bytes[i + 2 + j];
                          return out;
                      }
                  }
                  return null;
              }
          
              private List<String> parseDtcs(String raw, int responseMode) {
                  int[] b = hexBytes(raw);
                  List<String> out = new ArrayList<>();
                  int start = -1;
          
                  for (int i = 0; i < b.length; i++) {
                      if (b[i] == responseMode) {
                          start = i + 1;
                          break;
                      }
                  }
                  if (start < 0) return out;
          
                  for (int i = start; i + 1 < b.length; i += 2) {
                      int a = b[i], c = b[i + 1];
                      if (a == 0 && c == 0) continue;
          
                      char system = "PCBU".charAt((a >> 6) & 0x03);
                      int digit1 = (a >> 4) & 0x03;
                      int digit2 = a & 0x0F;
                      int digit3 = (c >> 4) & 0x0F;
                      int digit4 = c & 0x0F;
          
                      out.add("" + system + digit1
                              + hex1(digit2) + hex1(digit3) + hex1(digit4));
                  }
                  return out;
              }
          
              private char hex1(int v) {
                  return "0123456789ABCDEF".charAt(v & 0x0F);
              }
          
              private String listWithFamily(List<String> l) {
                  if (l.isEmpty()) return t("Niciuna / NO DATA", "None / NO DATA");
                  StringBuilder sb = new StringBuilder();
                  for (String s : l) {
                      sb.append("• ").append(s).append(" — ")
                              .append(dtcFamily(s)).append("\n");
                  }
                  return sb.toString().trim();
              }
          
              private String dtcFamily(String code) {
                  if (code == null || code.length() < 1) return "";
                  switch (Character.toUpperCase(code.charAt(0))) {
                      case 'P': return t("Powertrain / motor-transmisie", "Powertrain");
                      case 'B': return t("Body / caroserie-confort", "Body");
                      case 'C': return t("Chassis / sasiu", "Chassis");
                      case 'U': return t("Network / comunicatie", "Network");
                      default: return "";
                  }
              }
          
              private int[] hexBytes(String raw) {
                  if (raw == null) return new int[0];
          
                  String normalized = raw.toUpperCase(Locale.ROOT)
                          .replace("SEARCHING...", " ")
                          .replace("\r", " ")
                          .replace("\n", " ")
                          .replaceAll("[^0-9A-F]", " ");
          
                  String[] tokens = normalized.trim().split("\\s+");
                  ArrayList<Integer> vals = new ArrayList<>();
          
                  for (String token : tokens) {
                      if (token.length() == 2) {
                          try {
                              vals.add(Integer.parseInt(token, 16));
                          } catch (Exception ignored) {}
                      } else if (token.length() > 2 && token.length() % 2 == 0) {
                          for (int i = 0; i < token.length(); i += 2) {
                              try {
                                  vals.add(Integer.parseInt(token.substring(i, i + 2), 16));
                              } catch (Exception ignored) {}
                          }
                      }
                  }
          
                  int[] r = new int[vals.size()];
                  for (int i = 0; i < vals.size(); i++) r[i] = vals.get(i);
                  return r;
              }
          
              private String decodeVin(String raw) {
                  int[] b = hexBytes(raw);
                  StringBuilder vin = new StringBuilder();
                  boolean after = false;
          
                  for (int i = 0; i < b.length; i++) {
                      if (!after && b[i] == 0x49
                              && i + 2 < b.length && b[i + 1] == 0x02) {
                          after = true;
                          i += 2;
                          continue;
                      }
                      if (after) {
                          int v = b[i];
                          if (v >= 0x20 && v <= 0x7E) vin.append((char) v);
                      }
                  }
          
                  String s = vin.toString().replaceAll("[^A-HJ-NPR-Z0-9]", "");
                  if (s.length() >= 17) return s.substring(0, 17);
                  return s;
              }
          
              private String nrcSuffix(String raw) {
                  int[] b = hexBytes(raw);
                  for (int i = 0; i + 2 < b.length; i++) {
                      if (b[i] == 0x7F) {
                          int service = b[i + 1];
                          int nrc = b[i + 2];
                          return "  [NRC 0x"
                                  + String.format(Locale.US, "%02X", nrc)
                                  + " " + nrcName(nrc)
                                  + ", service 0x"
                                  + String.format(Locale.US, "%02X", service) + "]";
                      }
                  }
                  return "";
              }
          
              private String nrcName(int nrc) {
                  switch (nrc) {
                      case 0x10: return "generalReject";
                      case 0x11: return "serviceNotSupported";
                      case 0x12: return "subFunctionNotSupported";
                      case 0x13: return "incorrectLengthOrFormat";
                      case 0x21: return "busyRepeatRequest";
                      case 0x22: return "conditionsNotCorrect";
                      case 0x24: return "requestSequenceError";
                      case 0x31: return "requestOutOfRange";
                      case 0x33: return "securityAccessDenied";
                      case 0x35: return "invalidKey";
                      case 0x36: return "exceedNumberOfAttempts";
                      case 0x37: return "requiredTimeDelayNotExpired";
                      case 0x78: return "responsePending";
                      default: return "negativeResponse";
                  }
              }
          
              private String elm(String command, long waitMs) throws Exception {
                  if (output == null || input == null) {
                      throw new IllegalStateException("No ELM327 socket");
                  }
          
                  while (input.available() > 0) input.read();
          
                  output.write((command + "\r")
                          .getBytes(StandardCharsets.US_ASCII));
                  output.flush();
          
                  long end = System.currentTimeMillis() + waitMs;
                  StringBuilder sb = new StringBuilder();
          
                  while (System.currentTimeMillis() < end) {
                      while (input.available() > 0) {
                          int v = input.read();
                          if (v < 0) break;
          
                          char c = (char) v;
                          if (c == '>') {
                              String r = sb.toString().trim();
                              appendLog("> " + command + "\n" + clean(r));
                              return r;
                          }
                          sb.append(c);
                      }
                      Thread.sleep(20);
                  }
          
                  String r = sb.toString().trim();
                  appendLog("> " + command + "\n" + clean(r) + " [timeout]");
                  return r;
              }
          
              private boolean isUseful(String s) {
                  if (s == null) return false;
                  String x = clean(s).toUpperCase(Locale.ROOT);
                  return !(x.isEmpty()
                          || x.equals("?")
                          || x.contains("NO DATA")
                          || x.contains("UNABLE TO CONNECT")
                          || x.contains("STOPPED"));
              }
          
              private String sanitizeHex(String s) {
                  if (s == null) return "";
                  return s.toUpperCase(Locale.ROOT).replaceAll("[^0-9A-F]", "");
              }
          
              private void appendLog(String text) {
                  main.post(() -> {
                      if (log == null) return;
          
                      String old = log.getText().toString();
                      String next = old + "\n\n" + text;
          
                      if (next.length() > 40000) {
                          next = next.substring(next.length() - 40000);
                      }
                      log.setText(next);
                  });
              }
          
              private boolean requireConnection() {
                  if (isConnected()) return true;
          
                  dialog(t("Adaptor neconectat", "Adapter disconnected"),
                          t("Alege adaptorul si conecteaza-l mai intai.",
                                  "Choose and connect the adapter first."));
                  return false;
              }
          
              private boolean isConnected() {
                  return socket != null
                          && socket.isConnected()
                          && input != null
                          && output != null;
              }
          
              private void closeSocket() {
                  liveRunning = false;
                  main.removeCallbacks(liveTick);
          
                  try { if (input != null) input.close(); } catch (Exception ignored) {}
                  try { if (output != null) output.close(); } catch (Exception ignored) {}
                  try { if (socket != null) socket.close(); } catch (Exception ignored) {}
          
                  input = null;
                  output = null;
                  socket = null;
              }
          
              @Override
              protected void onDestroy() {
                  closeSocket();
                  io.shutdownNow();
                  super.onDestroy();
              }
          
              private boolean hasBtPermission() {
                  return Build.VERSION.SDK_INT < 31
                          || checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT)
                          == PackageManager.PERMISSION_GRANTED;
              }
          
              private void requestBtPermission() {
                  if (Build.VERSION.SDK_INT >= 31 && !hasBtPermission()) {
                      requestPermissions(
                              new String[]{Manifest.permission.BLUETOOTH_CONNECT}, 77);
                  }
              }
          
              private String safeName(BluetoothDevice d) {
                  if (d == null) return "OBD";
          
                  try {
                      String n = d.getName();
                      return n == null || n.trim().isEmpty() ? "Bluetooth device" : n;
                  } catch (SecurityException e) {
                      return "Bluetooth device";
                  }
              }
          
              private String clean(String s) {
                  if (s == null) return "";
                  return s.replace("\r", " ")
                          .replace("\n", " ")
                          .replaceAll("\\s+", " ")
                          .trim();
              }
          
              private String join(List<String> items, String sep) {
                  StringBuilder sb = new StringBuilder();
                  for (int i = 0; i < items.size(); i++) {
                      if (i > 0) sb.append(sep);
                      sb.append(items.get(i));
                  }
                  return sb.toString();
              }
          
              private String t(String ro, String en) {
                  return english ? en : ro;
              }
          
              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_SHORT).show();
              }
          
              private void dialog(String title, String msg) {
                  new AlertDialog.Builder(this)
                          .setTitle(title)
                          .setMessage(msg)
                          .setPositiveButton("OK", null)
                          .show();
              }
          
              private TextView label(String text, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(text);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  v.setTypeface(Typeface.create("sans-serif-light",
                          bold ? Typeface.BOLD : Typeface.NORMAL));
                  v.setGravity(Gravity.CENTER_VERTICAL);
                  return v;
              }
          
              private TextView monoBox(String text) {
                  TextView v = label(text, 12, Color.rgb(201, 209, 213), false);
                  v.setTypeface(Typeface.MONOSPACE);
                  v.setPadding(dp(12), dp(12), dp(12), dp(12));
                  v.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));
                  v.setTextIsSelectable(true);
                  return v;
              }
          
              private Button button(String text) {
