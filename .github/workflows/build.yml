                  Button identify = button(t("Identifica masina / ECU", "Identify vehicle / ECU"));
                  identify.setOnClickListener(v -> readVehicleInfo());
                  root.addView(identify, smallGap());
          
                  vehicleInfo = monoBox(t(
                          "VIN, protocol, tensiune, Calibration ID, CVN si identificare ECU vor aparea aici.",
                          "VIN, protocol, voltage, Calibration ID, CVN and ECU identification will appear here."));
                  root.addView(vehicleInfo, section());
          
                  sectionTitle(t("Parametri live extinsi", "Extended live data"));
          
                  LinearLayout grid1 = row();
                  rpmV = metric(grid1, "RPM");
                  speedV = metric(grid1, t("Viteza", "Speed"));
                  root.addView(grid1, smallGap());
          
                  LinearLayout grid2 = row();
