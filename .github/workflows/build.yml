                  dtcButton.setEnabled(false);
          
                  io.execute(() -> {
                      StringBuilder report = new StringBuilder();
                      try {
                          String storedRaw = elm("03", 2200);
                          String pendingRaw = elm("07", 2200);
                          String permanentRaw = elm("0A", 2200);
                          String readinessRaw = elm("0101", 1600);
                          String vinRaw = elm("0902", 2200);
                          String calRaw = elm("0904", 1800);
                          String cvnRaw = elm("0906", 1800);
          
                          List<String> stored = parseDtcs(storedRaw, 0x43);
                          List<String> pending = parseDtcs(pendingRaw, 0x47);
                          List<String> permanent = parseDtcs(permanentRaw, 0x4A);
          
