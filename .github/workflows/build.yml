                  root.addView(dtcBox, section());
          
                  sectionTitle(t("Mercedes Deep Scan - Read Only", "Mercedes Deep Scan - Read Only"));
          
                  TextView deepInfo = label(t(
                          "Scaneaza adresarea CAN de diagnoza 7E0-7E7 si incearca servicii UDS numai de citire: identificare ECU, memoria DTC, status bits, mirror memory, permanent status, snapshots si extended data unde modulul le suporta.",
                          "Scans diagnostic CAN addresses 7E0-7E7 and tries read-only UDS services: ECU identification, DTC memory, status bits, mirror memory, permanent status, snapshots and extended data where supported."),
                          12, MUTED, false);
                  deepInfo.setPadding(dp(12), dp(10), dp(12), dp(10));
                  deepInfo.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));
