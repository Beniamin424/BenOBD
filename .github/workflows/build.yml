                  headText.addView(label("BenOBD", 29, TEXT, true));
                  headText.addView(label(t("Mercedes W204 Deep Diagnostics", "Mercedes W204 Deep Diagnostics"),
                          14, MUTED, false));
                  headText.addView(label("v5.1 • Timed Deep Diagnostics", 11, GREEN, false));
                  header.addView(headText, new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
                  root.addView(header, section());
          
                  LinearLayout langRow = cardHorizontal();
                  langRow.addView(label(t("Limba interfetei", "Interface language"), 15, TEXT, false),
                          new LinearLayout.LayoutParams(0, dp(46), 1));
                  Button lang = compactButton(english ? "EN" : "RO");
                  lang.setOnClickListener(v -> {
                      english = !english;
                      prefs.edit().putBoolean("english", english).apply();
                      recreate();
                  });
                  langRow.addView(lang, new LinearLayout.LayoutParams(dp(76), dp(44)));
                  root.addView(langRow, section());
          
                  sectionTitle(t("Conexiune si adaptor", "Connection and adapter"));
          
                  status = label(t("Neconectat", "Disconnected"), 15, MUTED, false);
                  status.setPadding(dp(12), dp(10), dp(12), dp(10));
                  status.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));
                  root.addView(status, smallGap());
          
                  Button choose = button(t("Alege adaptorul Bluetooth", "Choose Bluetooth adapter"));
                  choose.setOnClickListener(v -> choosePairedDevice());
                  root.addView(choose, smallGap());
          
                  connectButton = button(t("Conecteaza", "Connect"));
                  connectButton.setOnClickListener(v -> connectSelected());
