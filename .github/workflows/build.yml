name: Build BenOBD v4 Deep Diagnostics APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create BenOBD v4 Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/ro/benobd/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BenOBD"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ro.benobd.app'
              compileSdk 35

              defaultConfig {
                  applicationId "ro.benobd.app"
                  minSdk 26
                  targetSdk 35
                  versionCode 5
                  versionName "4.0.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-feature android:name="android.hardware.bluetooth" android:required="false"/>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/w204_icon"
                  android:roundIcon="@drawable/w204_icon"
                  android:label="BenOBD"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans-serif-light</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080A0C</item>
                  <item name="android:navigationBarColor">#080A0C</item>
                  <item name="android:colorAccent">#D9E2E7</item>
                  <item name="android:windowBackground">#080A0C</item>
              </style>
          </resources>
          EOF

          cp .github/workflows/w204_icon.jpg app/src/main/res/drawable/w204_icon.jpg

          cat > app/src/main/java/ro/benobd/app/MainActivity.java <<'EOF'
          package ro.benobd.app;
          
          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;
          
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          
          public class MainActivity extends Activity {
              private static final int BG = Color.rgb(8, 10, 12);
              private static final int CARD = Color.rgb(18, 21, 24);
              private static final int CARD2 = Color.rgb(26, 30, 34);
              private static final int TEXT = Color.rgb(239, 243, 245);
              private static final int MUTED = Color.rgb(150, 160, 166);
              private static final int ACCENT = Color.rgb(218, 226, 231);
              private static final int GREEN = Color.rgb(91, 219, 146);
              private static final int RED = Color.rgb(245, 110, 110);
          
              private static final UUID SPP =
                      UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
          
              private final ExecutorService io = Executors.newSingleThreadExecutor();
              private final Handler main = new Handler(Looper.getMainLooper());
          
              private BluetoothAdapter adapter;
              private BluetoothDevice selectedDevice;
              private BluetoothSocket socket;
              private InputStream input;
              private OutputStream output;
          
              private LinearLayout root;
              private TextView status;
              private TextView vehicleInfo;
              private TextView dtcBox;
              private TextView deepBox;
              private TextView log;
