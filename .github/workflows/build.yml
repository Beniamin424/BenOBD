              private void clearDtcs() {
                  clearButton.setEnabled(false);
                  io.execute(() -> {
                      try {
                          String response = elm("04", 1800);
                          appendLog("CLEAR DTC RESPONSE: " + clean(response));
          
                          String verify = elm("03", 1800);
                          List<String> remain = parseDtcs(verify, 0x43);
          
                          String text = t("Raspuns stergere: ", "Clear response: ")
                                  + clean(response)
