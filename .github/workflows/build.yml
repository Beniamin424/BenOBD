name: Build BenOBD v5.1 Timed Deep Diagnostics APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create BenOBD v5.1 Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/ro/benobd/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BenOBD"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ro.benobd.app'
              compileSdk 35

              defaultConfig {
                  applicationId "ro.benobd.app"
                  minSdk 26
                  targetSdk 35
                  versionCode 7
                  versionName "5.1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-feature android:name="android.hardware.bluetooth" android:required="false"/>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/w204_icon"
                  android:roundIcon="@drawable/w204_icon"
                  android:label="BenOBD"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".LogActivity"
                      android:exported="false"/>
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans-serif-light</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080A0C</item>
                  <item name="android:navigationBarColor">#080A0C</item>
                  <item name="android:colorAccent">#D9E2E7</item>
                  <item name="android:windowBackground">#080A0C</item>
              </style>
          </resources>
          EOF

          cp .github/workflows/w204_icon.jpg app/src/main/res/drawable/w204_icon.jpg

          cat > app/src/main/java/ro/benobd/app/MainActivity.java <<'EOF'
          package ro.benobd.app;
          
          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.SystemClock;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;
          
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashSet;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;
          
          public class MainActivity extends Activity {
              private static final int BG = Color.rgb(8, 10, 12);
              private static final int CARD = Color.rgb(18, 21, 24);
              private static final int CARD2 = Color.rgb(26, 30, 34);
              private static final int TEXT = Color.rgb(239, 243, 245);
              private static final int MUTED = Color.rgb(150, 160, 166);
              private static final int ACCENT = Color.rgb(218, 226, 231);
              private static final int GREEN = Color.rgb(91, 219, 146);
              private static final int RED = Color.rgb(245, 110, 110);
          
              private static final UUID SPP =
                      UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");
          
              private final ExecutorService io = Executors.newSingleThreadExecutor();
              private final Handler main = new Handler(Looper.getMainLooper());
          
              private BluetoothAdapter adapter;
              private BluetoothDevice selectedDevice;
              private BluetoothSocket socket;
              private InputStream input;
              private OutputStream output;
          
              private LinearLayout root;
              private TextView status;
              private TextView vehicleInfo;
              private TextView dtcBox;
              private TextView deepBox;
              private TextView log;
              private TextView obdTimer;
              private TextView deepTimer;
              private Button connectButton;
              private Button liveButton;
              private Button dtcButton;
              private Button deepButton;
              private Button clearButton;
          
              private EditText expertTx;
              private EditText expertRx;
              private EditText expertCmd;
          
              private boolean liveRunning = false;
              private boolean english;
              private boolean forceMode;
              private SharedPreferences prefs;
          
              private TextView rpmV, speedV, coolantV, intakeV, loadV, throttleV, mafV, mapV,
                      fuelV, timingV, voltageV, ambientV, baroV, runtimeV, oilTempV, fuelRateV,
                      distClearV, obdStdV;
          
              private String currentScanText = "";
              private String latestUdsReport = "";
          
              private final Runnable liveTick = new Runnable() {
                  @Override public void run() {
                      if (!liveRunning || !isConnected()) return;
                      io.execute(() -> {
                          try {
                              String rpm = pid("0C", 2, "rpm");
                              String speed = pid("0D", 1, "speed");
                              String coolant = pid("05", 1, "temp");
                              String intake = pid("0F", 1, "temp");
                              String load = pid("04", 1, "percent");
                              String throttle = pid("11", 1, "percent");
                              String maf = pid("10", 2, "maf");
                              String map = pid("0B", 1, "map");
                              String fuel = pid("2F", 1, "percent");
                              String timing = pid("0E", 1, "timing");
                              String moduleV = pid("42", 2, "voltage");
                              String ambient = pid("46", 1, "temp");
                              String baro = pid("33", 1, "map");
                              String runtime = pid("1F", 2, "seconds");
                              String oilTemp = pid("5C", 1, "temp");
                              String fuelRate = pid("5E", 2, "fuelrate");
                              String distClear = pid("31", 2, "distance");
                              String obdStd = pid("1C", 1, "obdstd");
          
                              main.post(() -> {
                                  rpmV.setText(rpm);
                                  speedV.setText(speed);
                                  coolantV.setText(coolant);
                                  intakeV.setText(intake);
                                  loadV.setText(load);
                                  throttleV.setText(throttle);
                                  mafV.setText(maf);
                                  mapV.setText(map);
                                  fuelV.setText(fuel);
                                  timingV.setText(timing);
                                  voltageV.setText(moduleV);
                                  ambientV.setText(ambient);
                                  baroV.setText(baro);
                                  runtimeV.setText(runtime);
                                  oilTempV.setText(oilTemp);
                                  fuelRateV.setText(fuelRate);
                                  distClearV.setText(distClear);
                                  obdStdV.setText(obdStd);
                              });
                          } catch (Exception e) {
                              appendLog("LIVE ERROR: " + e.getMessage());
                          } finally {
                              main.postDelayed(liveTick, 5000);
                          }
                      });
                  }
              };
          
              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  prefs = getSharedPreferences("benobd", MODE_PRIVATE);
                  english = prefs.getBoolean("english", false);
                  if (!prefs.contains("tech_log")) {
                      prefs.edit().putString("tech_log",
                              t("BenOBD v5.1 pornit.", "BenOBD v5.1 started.")).apply();
                  }
                  adapter = BluetoothAdapter.getDefaultAdapter();
                  requestBtPermission();
                  drawUi();
              }
          
              private void drawUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(BG);
          
                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(12), dp(16), dp(44));
                  scroll.addView(root, new ScrollView.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));
          
                  LinearLayout header = cardHorizontal();
                  ImageView logo = new ImageView(this);
                  logo.setImageResource(ro.benobd.app.R.drawable.w204_icon);
                  logo.setScaleType(ImageView.ScaleType.CENTER_CROP);
