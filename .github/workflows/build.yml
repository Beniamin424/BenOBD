name: Build BenOBD v3 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Create BenOBD v3 Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/ro/benobd/app
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "BenOBD"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ro.benobd.app'
              compileSdk 35

              defaultConfig {
                  applicationId "ro.benobd.app"
                  minSdk 26
                  targetSdk 35
                  versionCode 4
                  versionName "3.0.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30"/>
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>
              <uses-feature android:name="android.hardware.bluetooth" android:required="false"/>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/w204_icon"
                  android:roundIcon="@drawable/w204_icon"
                  android:label="BenOBD"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="unspecified">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans-serif-light</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080A0C</item>
                  <item name="android:navigationBarColor">#080A0C</item>
                  <item name="android:colorAccent">#D9E2E7</item>
                  <item name="android:windowBackground">#080A0C</item>
              </style>
          </resources>
          EOF

          cp .github/workflows/w204_icon.jpg app/src/main/res/drawable/w204_icon.jpg

          cat > app/src/main/java/ro/benobd/app/MainActivity.java <<'EOF'
          package ro.benobd.app;

          import android.Manifest;
          import android.app.Activity;
          import android.app.AlertDialog;
          import android.bluetooth.BluetoothAdapter;
          import android.bluetooth.BluetoothDevice;
          import android.bluetooth.BluetoothSocket;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.CompoundButton;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.Switch;
          import android.widget.TextView;
          import android.widget.Toast;

          import java.io.InputStream;
          import java.io.OutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Locale;
          import java.util.Set;
          import java.util.UUID;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class MainActivity extends Activity {
              private static final int BG = Color.rgb(8, 10, 12);
              private static final int CARD = Color.rgb(18, 21, 24);
              private static final int CARD2 = Color.rgb(26, 30, 34);
              private static final int TEXT = Color.rgb(239, 243, 245);
              private static final int MUTED = Color.rgb(150, 160, 166);
              private static final int ACCENT = Color.rgb(218, 226, 231);
              private static final int GREEN = Color.rgb(91, 219, 146);
              private static final int RED = Color.rgb(245, 110, 110);
              private static final UUID SPP = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB");

              private final ExecutorService io = Executors.newSingleThreadExecutor();
              private final Handler main = new Handler(Looper.getMainLooper());

              private BluetoothAdapter adapter;
              private BluetoothDevice selectedDevice;
              private BluetoothSocket socket;
              private InputStream input;
              private OutputStream output;

              private LinearLayout root;
              private TextView status;
              private TextView vehicleInfo;
              private TextView dtcBox;
              private TextView log;
              private Button connectButton;
              private Button liveButton;
              private Button dtcButton;
              private Button clearButton;
              private boolean liveRunning = false;
              private boolean english;
              private boolean forceMode;
              private SharedPreferences prefs;

              private TextView rpmV, speedV, coolantV, intakeV, loadV, throttleV, mafV, mapV, fuelV, timingV, voltageV, ambientV;

              private final Runnable liveTick = new Runnable() {
                  @Override public void run() {
                      if (!liveRunning || !isConnected()) return;
                      io.execute(() -> {
                          try {
                              String rpm = pid("0C", 2, "rpm");
                              String speed = pid("0D", 1, "speed");
                              String coolant = pid("05", 1, "temp");
                              String intake = pid("0F", 1, "temp");
                              String load = pid("04", 1, "percent");
                              String throttle = pid("11", 1, "percent");
                              String maf = pid("10", 2, "maf");
                              String map = pid("0B", 1, "map");
                              String fuel = pid("2F", 1, "percent");
                              String timing = pid("0E", 1, "timing");
                              String moduleV = pid("42", 2, "voltage");
                              String ambient = pid("46", 1, "temp");
                              main.post(() -> {
                                  rpmV.setText(rpm);
                                  speedV.setText(speed);
                                  coolantV.setText(coolant);
                                  intakeV.setText(intake);
                                  loadV.setText(load);
                                  throttleV.setText(throttle);
                                  mafV.setText(maf);
                                  mapV.setText(map);
                                  fuelV.setText(fuel);
                                  timingV.setText(timing);
                                  voltageV.setText(moduleV);
                                  ambientV.setText(ambient);
                              });
                          } catch (Exception e) {
                              appendLog("LIVE ERROR: " + e.getMessage());
                          } finally {
                              main.postDelayed(liveTick, 4500);
                          }
                      });
                  }
              };

              @Override
              protected void onCreate(Bundle state) {
                  super.onCreate(state);
                  prefs = getSharedPreferences("benobd", MODE_PRIVATE);
                  english = prefs.getBoolean("english", false);
                  adapter = BluetoothAdapter.getDefaultAdapter();
                  requestBtPermission();
                  drawUi();
              }

              private void drawUi() {
                  ScrollView scroll = new ScrollView(this);
                  scroll.setFillViewport(true);
                  scroll.setBackgroundColor(BG);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dp(16), dp(12), dp(16), dp(42));
                  scroll.addView(root, new ScrollView.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT));

                  LinearLayout header = cardHorizontal();
                  ImageView logo = new ImageView(this);
                  logo.setImageResource(ro.benobd.app.R.drawable.w204_icon);
                  logo.setScaleType(ImageView.ScaleType.CENTER_CROP);
                  header.addView(logo, new LinearLayout.LayoutParams(dp(82), dp(82)));

                  LinearLayout headText = new LinearLayout(this);
                  headText.setOrientation(LinearLayout.VERTICAL);
                  headText.setPadding(dp(14), 0, 0, 0);
                  TextView title = label("BenOBD", 28, TEXT, true);
                  TextView subtitle = label(t("Mercedes W204 Diagnostic Suite", "Mercedes W204 Diagnostic Suite"), 14, MUTED, false);
                  headText.addView(title);
                  headText.addView(subtitle);
                  header.addView(headText, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1));
                  root.addView(header, section());

                  LinearLayout langRow = cardHorizontal();
                  langRow.addView(label(t("Limba interfetei", "Interface language"), 15, TEXT, false),
                          new LinearLayout.LayoutParams(0, dp(46), 1));
                  Button lang = compactButton(english ? "EN" : "RO");
                  lang.setOnClickListener(v -> {
                      english = !english;
                      prefs.edit().putBoolean("english", english).apply();
                      recreate();
                  });
                  langRow.addView(lang, new LinearLayout.LayoutParams(dp(76), dp(44)));
                  root.addView(langRow, section());

                  sectionTitle(t("Conexiune", "Connection"));

                  status = label(t("Neconectat", "Disconnected"), 15, MUTED, false);
                  status.setPadding(dp(12), dp(10), dp(12), dp(10));
                  status.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));
                  root.addView(status, smallGap());

                  Button choose = button(t("Alege adaptorul ELM327", "Choose ELM327 adapter"));
                  choose.setOnClickListener(v -> choosePairedDevice());
                  root.addView(choose, smallGap());

                  connectButton = button(t("Conecteaza", "Connect"));
                  connectButton.setOnClickListener(v -> connectSelected());
                  root.addView(connectButton, smallGap());

                  Button identify = button(t("Identifica masina / ECU", "Identify vehicle / ECU"));
                  identify.setOnClickListener(v -> readVehicleInfo());
                  root.addView(identify, smallGap());

                  vehicleInfo = monoBox(t("VIN, protocol, tensiune si identificare ECU vor aparea aici.",
                          "VIN, protocol, voltage and ECU identification will appear here."));
                  root.addView(vehicleInfo, section());

                  sectionTitle(t("Parametri live", "Live data"));

                  LinearLayout grid1 = new LinearLayout(this);
                  grid1.setOrientation(LinearLayout.HORIZONTAL);
                  rpmV = metric(grid1, "RPM");
                  speedV = metric(grid1, t("Viteza", "Speed"));
                  root.addView(grid1, smallGap());

                  LinearLayout grid2 = new LinearLayout(this);
                  grid2.setOrientation(LinearLayout.HORIZONTAL);
                  coolantV = metric(grid2, t("Lichid racire", "Coolant"));
                  intakeV = metric(grid2, t("Aer admisie", "Intake air"));
                  root.addView(grid2, smallGap());

                  LinearLayout grid3 = new LinearLayout(this);
                  grid3.setOrientation(LinearLayout.HORIZONTAL);
                  loadV = metric(grid3, t("Sarcina motor", "Engine load"));
                  throttleV = metric(grid3, t("Acceleratie", "Throttle"));
                  root.addView(grid3, smallGap());

                  LinearLayout grid4 = new LinearLayout(this);
                  grid4.setOrientation(LinearLayout.HORIZONTAL);
                  mafV = metric(grid4, "MAF");
                  mapV = metric(grid4, "MAP");
                  root.addView(grid4, smallGap());

                  LinearLayout grid5 = new LinearLayout(this);
                  grid5.setOrientation(LinearLayout.HORIZONTAL);
                  fuelV = metric(grid5, t("Nivel combustibil", "Fuel level"));
                  timingV = metric(grid5, t("Avans", "Timing"));
                  root.addView(grid5, smallGap());

                  LinearLayout grid6 = new LinearLayout(this);
                  grid6.setOrientation(LinearLayout.HORIZONTAL);
                  voltageV = metric(grid6, t("Tensiune ECU", "ECU voltage"));
                  ambientV = metric(grid6, t("Temp. ambient", "Ambient temp"));
                  root.addView(grid6, smallGap());

                  liveButton = button(t("Porneste Live Data", "Start Live Data"));
                  liveButton.setOnClickListener(v -> toggleLive());
                  root.addView(liveButton, section());

                  Button supported = secondaryButton(t("Scaneaza PID-uri suportate", "Scan supported PIDs"));
                  supported.setOnClickListener(v -> scanSupportedPids());
                  root.addView(supported, smallGap());

                  sectionTitle(t("Diagnoza OBD-II", "OBD-II diagnostics"));

                  dtcButton = button(t("Citeste erorile", "Read trouble codes"));
                  dtcButton.setOnClickListener(v -> readDtcs());
                  root.addView(dtcButton, smallGap());

                  Button readiness = secondaryButton(t("Readiness / Check Engine", "Readiness / Check Engine"));
                  readiness.setOnClickListener(v -> readReadiness());
                  root.addView(readiness, smallGap());

                  clearButton = dangerButton(t("Sterge erorile OBD", "Clear OBD trouble codes"));
                  clearButton.setOnClickListener(v -> confirmClear());
                  root.addView(clearButton, smallGap());

                  dtcBox = monoBox(t("Erorile stocate, pending si permanente vor aparea aici.",
                          "Stored, pending and permanent trouble codes will appear here."));
                  root.addView(dtcBox, section());

                  sectionTitle(t("Codari si activari", "Coding and activations"));

                  Switch force = makeSwitch(
                          t("Force Mode experimental", "Experimental Force Mode"),
                          t("Permite folosirea profilelor Mercedes verificate. Sistemele critice raman excluse.",
                                  "Allows verified Mercedes profiles. Critical systems remain excluded.")
                  );
                  force.setOnCheckedChangeListener((b, checked) -> {
                      forceMode = checked;
                      toast(checked ? t("Force Mode activ.", "Force Mode enabled.")
                              : t("Safe Mode activ.", "Safe Mode enabled."));
                  });
                  root.addView(force, smallGap());

                  addCodingSwitch("needle", "Needle Sweep");
                  addCodingSwitch("amg", "AMG Menu / Display");
                  addCodingSwitch("speed", t("Viteza digitala", "Digital speed"));
                  addCodingSwitch("mirrors", t("Oglinzi la incuiere", "Fold mirrors on lock"));
                  addCodingSwitch("autolock", "Auto Lock");
                  addCodingSwitch("drl", "DRL");
                  addCodingSwitch("welcome", "Coming Home / Welcome Lights");
                  addCodingSwitch("confirm", t("Confirmare lumini la inchidere", "Lock light confirmation"));

                  TextView safe = label(
                          t("ABS/ESP, SRS/Airbag, EIS/EZS, ECU motor si TCU nu sunt scrise de Force Mode.",
                                  "ABS/ESP, SRS/Airbag, EIS/EZS, engine ECU and TCU are never written by Force Mode."),
                          12, GREEN, false);
                  safe.setPadding(dp(10), dp(10), dp(10), dp(10));
                  root.addView(safe, smallGap());

                  sectionTitle(t("Jurnal tehnic", "Technical log"));
                  log = monoBox(t("BenOBD v3 pornit.", "BenOBD v3 started."));
                  root.addView(log, smallGap());

                  Button copyLog = secondaryButton(t("Copiaza jurnalul", "Copy log"));
                  copyLog.setOnClickListener(v -> {
                      ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("BenOBD log", log.getText()));
                      toast(t("Jurnal copiat.", "Log copied."));
                  });
                  root.addView(copyLog, smallGap());

                  setContentView(scroll);
              }

              private void sectionTitle(String text) {
                  TextView t = label(text, 20, TEXT, true);
                  LinearLayout.LayoutParams p = params();
                  p.topMargin = dp(24);
                  p.bottomMargin = dp(4);
                  root.addView(t, p);
              }

              private TextView metric(LinearLayout row, String name) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(12), dp(12), dp(12), dp(12));
                  box.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));

                  TextView n = label(name, 12, MUTED, false);
                  TextView v = label("--", 22, TEXT, true);
                  box.addView(n);
                  box.addView(v);

                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1);
                  p.setMargins(dp(3), dp(3), dp(3), dp(3));
                  row.addView(box, p);
                  return v;
              }

              private void choosePairedDevice() {
                  if (!hasBtPermission()) {
                      requestBtPermission();
                      return;
                  }
                  if (adapter == null) {
                      dialog("Bluetooth", t("Bluetooth indisponibil pe acest telefon.", "Bluetooth unavailable on this phone."));
                      return;
                  }

                  Set<BluetoothDevice> bonded = adapter.getBondedDevices();
                  List<BluetoothDevice> devices = new ArrayList<>();

                  if (bonded != null) {
                      for (BluetoothDevice d : bonded) {
                          String n = safeName(d);
                          String low = n.toLowerCase(Locale.ROOT);
                          if (low.contains("elm") || low.contains("obd") || low.contains("vgate")
                                  || low.contains("vlink") || low.contains("obdii")) {
                              devices.add(d);
                          }
                      }
                  }

                  if (devices.isEmpty()) {
                      dialog(t("Niciun adaptor gasit", "No adapter found"),
                              t("Imperecheaza ELM327 din setarile Bluetooth Android, apoi revino.",
                                      "Pair ELM327 in Android Bluetooth settings, then return."));
                      return;
                  }

                  String[] names = new String[devices.size()];
                  for (int i = 0; i < devices.size(); i++) {
                      names[i] = safeName(devices.get(i)) + "\n" + devices.get(i).getAddress();
                  }

                  new AlertDialog.Builder(this)
                          .setTitle(t("Alege adaptorul", "Choose adapter"))
                          .setItems(names, (d, which) -> {
                              selectedDevice = devices.get(which);
                              status.setText(t("Selectat: ", "Selected: ") + safeName(selectedDevice));
                          }).show();
              }

              private void connectSelected() {
                  if (!hasBtPermission()) {
                      requestBtPermission();
                      return;
                  }
                  if (selectedDevice == null) {
                      choosePairedDevice();
                      return;
                  }

                  status.setText(t("Conectare...", "Connecting..."));
                  connectButton.setEnabled(false);

                  io.execute(() -> {
                      try {
                          closeSocket();
                          socket = selectedDevice.createRfcommSocketToServiceRecord(SPP);
                          socket.connect();
                          input = socket.getInputStream();
                          output = socket.getOutputStream();

                          String atz = elm("ATZ", 2200);
                          elm("ATE0", 800);
                          elm("ATL0", 800);
                          elm("ATS1", 800);
                          elm("ATH0", 800);
                          elm("ATSP0", 1000);
                          String ati = elm("ATI", 900);
                          String volts = elm("ATRV", 900);
                          String proto = elm("ATDP", 900);

                          appendLog("ADAPTER: " + clean(ati));
                          appendLog("VOLTAGE: " + clean(volts));
                          appendLog("PROTOCOL: " + clean(proto));

                          main.post(() -> {
                              status.setText(t("Conectat: ", "Connected: ") + safeName(selectedDevice)
                                      + " • " + clean(volts));
                              connectButton.setEnabled(true);
                          });
                      } catch (Exception e) {
                          appendLog("CONNECT ERROR: " + e.getClass().getSimpleName() + " " + e.getMessage());
                          closeSocket();
                          main.post(() -> {
                              status.setText(t("Conectarea a esuat", "Connection failed"));
                              connectButton.setEnabled(true);
                          });
                      }
                  });
              }

              private void readVehicleInfo() {
                  if (!requireConnection()) return;
                  io.execute(() -> {
                      try {
                          String vinRaw = elm("0902", 2200);
                          String cal = elm("0904", 1800);
                          String cvn = elm("0906", 1800);
                          String volts = elm("ATRV", 900);
                          String proto = elm("ATDP", 900);
                          String vin = decodeVin(vinRaw);
                          String text = "VIN: " + (vin.isEmpty() ? clean(vinRaw) : vin)
                                  + "\n" + t("Protocol: ", "Protocol: ") + clean(proto)
                                  + "\n" + t("Tensiune: ", "Voltage: ") + clean(volts)
                                  + "\nCalibration ID: " + clean(cal)
                                  + "\nCVN: " + clean(cvn);
                          appendLog("VEHICLE INFO\n" + text);
                          main.post(() -> vehicleInfo.setText(text));
                      } catch (Exception e) {
                          appendLog("IDENTIFY ERROR: " + e.getMessage());
                      }
                  });
              }

              private void toggleLive() {
                  if (!requireConnection()) return;
                  liveRunning = !liveRunning;
                  if (liveRunning) {
                      liveButton.setText(t("Opreste Live Data", "Stop Live Data"));
                      main.removeCallbacks(liveTick);
                      main.post(liveTick);
                  } else {
                      liveButton.setText(t("Porneste Live Data", "Start Live Data"));
                      main.removeCallbacks(liveTick);
                  }
              }

              private void readDtcs() {
                  if (!requireConnection()) return;
                  dtcButton.setEnabled(false);
                  io.execute(() -> {
                      try {
                          String storedRaw = elm("03", 1800);
                          String pendingRaw = elm("07", 1800);
                          String permanentRaw = elm("0A", 1800);

                          List<String> stored = parseDtcs(storedRaw, 0x43);
                          List<String> pending = parseDtcs(pendingRaw, 0x47);
                          List<String> permanent = parseDtcs(permanentRaw, 0x4A);

                          String text = t("STOCATE", "STORED") + ":\n" + listOrNone(stored)
                                  + "\n\nPENDING:\n" + listOrNone(pending)
                                  + "\n\n" + t("PERMANENTE", "PERMANENT") + ":\n" + listOrNone(permanent);

                          appendLog("DTC SCAN\n" + text);
                          main.post(() -> {
                              dtcBox.setText(text);
                              dtcButton.setEnabled(true);
                          });
                      } catch (Exception e) {
                          appendLog("DTC ERROR: " + e.getMessage());
                          main.post(() -> dtcButton.setEnabled(true));
                      }
                  });
              }

              private void readReadiness() {
                  if (!requireConnection()) return;
                  io.execute(() -> {
                      try {
                          String raw = elm("0101", 1400);
                          int[] data = findPidBytes(raw, 0x41, 0x01, 4);
                          String text;
                          if (data == null) {
                              text = t("ECU nu a returnat status readiness.", "ECU did not return readiness status.");
                          } else {
                              boolean mil = (data[0] & 0x80) != 0;
                              int count = data[0] & 0x7F;
                              text = t("Check Engine/MIL: ", "Check Engine/MIL: ") + (mil ? "ON" : "OFF")
                                      + "\n" + t("Numar DTC raportat de ECU: ", "DTC count reported by ECU: ") + count
                                      + "\nRAW: " + clean(raw);
                          }
                          appendLog("READINESS\n" + text);
                          String finalText = text;
                          main.post(() -> dtcBox.setText(finalText));
                      } catch (Exception e) {
                          appendLog("READINESS ERROR: " + e.getMessage());
                      }
                  });
              }

              private void confirmClear() {
                  if (!requireConnection()) return;
                  new AlertDialog.Builder(this)
                          .setTitle(t("Stergere erori OBD", "Clear OBD trouble codes"))
                          .setMessage(t(
                                  "Comanda OBD Mode 04 sterge erorile de emisii si poate reseta freeze-frame/readiness. Motorul trebuie sa fie oprit, contactul pus. Continui?",
                                  "OBD Mode 04 clears emissions DTCs and may reset freeze-frame/readiness. Engine should be off, ignition on. Continue?"
                          ))
                          .setNegativeButton(t("Anuleaza", "Cancel"), null)
                          .setPositiveButton(t("Sterge", "Clear"), (d, w) -> clearDtcs())
                          .show();
              }

              private void clearDtcs() {
                  clearButton.setEnabled(false);
                  io.execute(() -> {
                      try {
                          String response = elm("04", 1800);
                          appendLog("CLEAR DTC RESPONSE: " + clean(response));
                          String verify = elm("03", 1800);
                          List<String> remain = parseDtcs(verify, 0x43);
                          String text = t("Raspuns stergere: ", "Clear response: ") + clean(response)
                                  + "\n\n" + t("Erori ramase: ", "Remaining codes: ") + listOrNone(remain);
                          main.post(() -> {
                              dtcBox.setText(text);
                              clearButton.setEnabled(true);
                          });
                      } catch (Exception e) {
                          appendLog("CLEAR ERROR: " + e.getMessage());
                          main.post(() -> clearButton.setEnabled(true));
                      }
                  });
              }

              private void scanSupportedPids() {
                  if (!requireConnection()) return;
                  io.execute(() -> {
                      StringBuilder sb = new StringBuilder();
                      try {
                          for (String cmd : Arrays.asList("0100", "0120", "0140", "0160", "0180", "01A0", "01C0")) {
                              String r = elm(cmd, 1400);
                              sb.append(cmd).append(": ").append(clean(r)).append("\n");
                          }
                          appendLog("SUPPORTED PID MAP\n" + sb);
                          main.post(() -> vehicleInfo.setText(t("Harta PID a fost citita. Vezi Jurnal tehnic.",
                                  "PID map read. See Technical log.")));
                      } catch (Exception e) {
                          appendLog("PID MAP ERROR: " + e.getMessage());
                      }
                  });
              }

              private void addCodingSwitch(String key, String name) {
                  Switch s = makeSwitch(name,
                          t("Activare Mercedes specifica. Necesita profil verificat pentru modulul detectat.",
                                  "Mercedes-specific activation. Requires a verified profile for the detected module."));
                  s.setOnCheckedChangeListener((buttonView, checked) -> {
                      if (!buttonView.isPressed()) return;
                      buttonView.setChecked(!checked);
                      if (!requireConnection()) return;
                      if (!forceMode) {
                          dialog(t("Safe Mode", "Safe Mode"),
                                  t("Activeaza Force Mode pentru codari de confort.", "Enable Force Mode for comfort coding."));
                          return;
                      }
                      dialog(t("Profil Mercedes necesar", "Mercedes profile required"),
                              t("BenOBD nu va inventa payload-uri de codare. Pentru " + name
                                              + " trebuie identificat modulul W204 si incarcata o secventa verificata. "
                                              + "Diagnoza, Live Data si stergerea DTC sunt functionale acum.",
                                      "BenOBD will not invent coding payloads. For " + name
                                              + " the W204 module must be identified and a verified sequence loaded. "
                                              + "Diagnostics, Live Data and DTC clearing are functional now."));
                  });
                  root.addView(s, smallGap());
              }

              private String pid(String pid, int bytes, String type) throws Exception {
                  String raw = elm("01" + pid, 1100);
                  int[] d = findPidBytes(raw, 0x41, Integer.parseInt(pid, 16), bytes);
                  if (d == null) return "--";

                  switch (type) {
                      case "rpm":
                          return String.format(Locale.US, "%.0f rpm", ((d[0] * 256) + d[1]) / 4.0);
                      case "speed":
                          return d[0] + " km/h";
                      case "temp":
                          return (d[0] - 40) + " °C";
                      case "percent":
                          return String.format(Locale.US, "%.0f %%", d[0] * 100.0 / 255.0);
                      case "maf":
                          return String.format(Locale.US, "%.2f g/s", ((d[0] * 256) + d[1]) / 100.0);
                      case "map":
                          return d[0] + " kPa";
                      case "timing":
                          return String.format(Locale.US, "%.1f °", d[0] / 2.0 - 64.0);
                      case "voltage":
                          return String.format(Locale.US, "%.2f V", ((d[0] * 256) + d[1]) / 1000.0);
                      default:
                          return "--";
                  }
              }

              private int[] findPidBytes(String raw, int mode, int pid, int count) {
                  int[] bytes = hexBytes(raw);
                  for (int i = 0; i < bytes.length - (count + 1); i++) {
                      if (bytes[i] == mode && bytes[i + 1] == pid) {
                          int[] out = new int[count];
                          for (int j = 0; j < count; j++) out[j] = bytes[i + 2 + j];
                          return out;
                      }
                  }
                  return null;
              }

              private List<String> parseDtcs(String raw, int responseMode) {
                  int[] b = hexBytes(raw);
                  List<String> out = new ArrayList<>();
                  int start = -1;
                  for (int i = 0; i < b.length; i++) {
                      if (b[i] == responseMode) {
                          start = i + 1;
                          break;
                      }
                  }
                  if (start < 0) return out;
                  for (int i = start; i + 1 < b.length; i += 2) {
                      int a = b[i], c = b[i + 1];
                      if (a == 0 && c == 0) continue;
                      char system = "PCBU".charAt((a >> 6) & 0x03);
                      int digit1 = (a >> 4) & 0x03;
                      int digit2 = a & 0x0F;
                      int digit3 = (c >> 4) & 0x0F;
                      int digit4 = c & 0x0F;
                      out.add("" + system + digit1 + hex1(digit2) + hex1(digit3) + hex1(digit4));
                  }
                  return out;
              }

              private char hex1(int v) {
                  return "0123456789ABCDEF".charAt(v & 0x0F);
              }

              private String listOrNone(List<String> l) {
                  if (l.isEmpty()) return t("Niciuna / NO DATA", "None / NO DATA");
                  StringBuilder sb = new StringBuilder();
                  for (String s : l) sb.append("• ").append(s).append("\n");
                  return sb.toString().trim();
              }

              private int[] hexBytes(String raw) {
                  if (raw == null) return new int[0];
                  String normalized = raw.toUpperCase(Locale.ROOT)
                          .replaceAll("SEARCHING\\.\\.\\.", " ")
                          .replaceAll("BUS INIT:.*", " ")
                          .replaceAll("[^0-9A-F]", " ");
                  String[] tokens = normalized.trim().split("\\s+");
                  ArrayList<Integer> vals = new ArrayList<>();
                  for (String token : tokens) {
                      if (token.length() == 2) {
                          try { vals.add(Integer.parseInt(token, 16)); } catch (Exception ignored) {}
                      }
                  }
                  int[] r = new int[vals.size()];
                  for (int i = 0; i < vals.size(); i++) r[i] = vals.get(i);
                  return r;
              }

              private String decodeVin(String raw) {
                  int[] b = hexBytes(raw);
                  StringBuilder vin = new StringBuilder();
                  boolean after = false;
                  for (int i = 0; i < b.length; i++) {
                      if (!after && b[i] == 0x49 && i + 2 < b.length && b[i + 1] == 0x02) {
                          after = true;
                          i += 2;
                          continue;
                      }
                      if (after) {
                          int v = b[i];
                          if (v >= 0x20 && v <= 0x7E) vin.append((char) v);
                      }
                  }
                  String s = vin.toString().replaceAll("[^A-HJ-NPR-Z0-9]", "");
                  if (s.length() >= 17) return s.substring(0, 17);
                  return s;
              }

              private String elm(String command, long waitMs) throws Exception {
                  if (output == null || input == null) throw new IllegalStateException("No ELM327 socket");
                  while (input.available() > 0) input.read();

                  output.write((command + "\r").getBytes(StandardCharsets.US_ASCII));
                  output.flush();

                  long end = System.currentTimeMillis() + waitMs;
                  StringBuilder sb = new StringBuilder();

                  while (System.currentTimeMillis() < end) {
                      while (input.available() > 0) {
                          int v = input.read();
                          if (v < 0) break;
                          char c = (char) v;
                          if (c == '>') {
                              String r = sb.toString().trim();
                              appendLog("> " + command + "\n" + clean(r));
                              return r;
                          }
                          sb.append(c);
                      }
                      Thread.sleep(20);
                  }

                  String r = sb.toString().trim();
                  appendLog("> " + command + "\n" + clean(r) + " [timeout]");
                  return r;
              }

              private void appendLog(String text) {
                  main.post(() -> {
                      if (log == null) return;
                      String old = log.getText().toString();
                      String next = old + "\n\n" + text;
                      if (next.length() > 18000) next = next.substring(next.length() - 18000);
                      log.setText(next);
                  });
              }

              private boolean requireConnection() {
                  if (isConnected()) return true;
                  dialog(t("ELM327 neconectat", "ELM327 disconnected"),
                          t("Alege adaptorul si conecteaza-l mai intai.", "Choose and connect the adapter first."));
                  return false;
              }

              private boolean isConnected() {
                  return socket != null && socket.isConnected() && input != null && output != null;
              }

              private void closeSocket() {
                  liveRunning = false;
                  main.removeCallbacks(liveTick);
                  try { if (input != null) input.close(); } catch (Exception ignored) {}
                  try { if (output != null) output.close(); } catch (Exception ignored) {}
                  try { if (socket != null) socket.close(); } catch (Exception ignored) {}
                  input = null;
                  output = null;
                  socket = null;
              }

              @Override protected void onDestroy() {
                  closeSocket();
                  io.shutdownNow();
                  super.onDestroy();
              }

              private boolean hasBtPermission() {
                  return Build.VERSION.SDK_INT < 31
                          || checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED;
              }

              private void requestBtPermission() {
                  if (Build.VERSION.SDK_INT >= 31 && !hasBtPermission()) {
                      requestPermissions(new String[]{Manifest.permission.BLUETOOTH_CONNECT}, 77);
                  }
              }

              private String safeName(BluetoothDevice d) {
                  if (d == null) return "ELM327";
                  try {
                      String n = d.getName();
                      return n == null || n.trim().isEmpty() ? "ELM327" : n;
                  } catch (SecurityException e) {
                      return "ELM327";
                  }
              }

              private String clean(String s) {
                  if (s == null) return "";
                  return s.replace("\r", " ").replace("\n", " ").replaceAll("\\s+", " ").trim();
              }

              private String t(String ro, String en) { return english ? en : ro; }

              private void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }

              private void dialog(String title, String msg) {
                  new AlertDialog.Builder(this).setTitle(title).setMessage(msg).setPositiveButton("OK", null).show();
              }

              private TextView label(String text, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(text);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  v.setTypeface(Typeface.create("sans-serif-light", bold ? Typeface.BOLD : Typeface.NORMAL));
                  v.setGravity(Gravity.CENTER_VERTICAL);
                  return v;
              }

              private TextView monoBox(String text) {
                  TextView v = label(text, 12, Color.rgb(201, 209, 213), false);
                  v.setTypeface(Typeface.MONOSPACE);
                  v.setPadding(dp(12), dp(12), dp(12), dp(12));
                  v.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));
                  v.setTextIsSelectable(true);
                  return v;
              }

              private Button button(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.rgb(15, 17, 19));
                  b.setTextSize(15);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.create("sans-serif-light", Typeface.BOLD));
                  b.setBackground(roundRect(ACCENT, ACCENT, 0, 13));
                  return b;
              }

              private Button compactButton(String text) {
                  Button b = button(text);
                  b.setTextSize(13);
                  return b;
              }

              private Button secondaryButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(TEXT);
                  b.setTextSize(14);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));
                  b.setBackground(roundRect(CARD2, Color.rgb(66, 73, 78), 1, 13));
                  return b;
              }

              private Button dangerButton(String text) {
                  Button b = secondaryButton(text);
                  b.setTextColor(Color.rgb(255, 205, 205));
                  b.setBackground(roundRect(Color.rgb(45, 20, 22), Color.rgb(116, 55, 58), 1, 13));
                  return b;
              }

              private Switch makeSwitch(String title, String description) {
                  Switch s = new Switch(this);
                  s.setText(title + "\n" + description);
                  s.setTextColor(TEXT);
                  s.setTextSize(14);
                  s.setPadding(dp(12), dp(10), dp(10), dp(10));
                  s.setGravity(Gravity.CENTER_VERTICAL);
                  s.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));
                  s.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));
                  return s;
              }

              private LinearLayout cardHorizontal() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.HORIZONTAL);
                  l.setGravity(Gravity.CENTER_VERTICAL);
                  l.setPadding(dp(10), dp(10), dp(10), dp(10));
                  l.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 16));
                  return l;
              }

              private GradientDrawable roundRect(int fill, int stroke, int width, int radius) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(fill);
                  d.setCornerRadius(dp(radius));
                  if (width > 0) d.setStroke(dp(width), stroke);
                  return d;
              }

              private LinearLayout.LayoutParams params() {
                  return new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
              }

              private LinearLayout.LayoutParams section() {
                  LinearLayout.LayoutParams p = params();
                  p.topMargin = dp(10);
                  return p;
              }

              private LinearLayout.LayoutParams smallGap() {
                  LinearLayout.LayoutParams p = params();
                  p.topMargin = dp(7);
                  return p;
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BenOBD-v3.apk

      - name: Upload BenOBD v3 APK
        uses: actions/upload-artifact@v4
        with:
          name: BenOBD-v3-APK
          path: BenOBD-v3.apk
          retention-days: 30
