      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BenOBD-v4.apk

      - name: Upload BenOBD v4 APK
        uses: actions/upload-artifact@v4
        with:
          name: BenOBD-v4-APK
          path: BenOBD-v4.apk
          retention-days: 30
