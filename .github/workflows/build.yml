                  clearButton.setEnabled(false);
                  io.execute(() -> {
                      try {
                          String response = elm("04", 1800);
                          appendLog("CLEAR DTC RESPONSE: " + clean(response));
                          String verify = elm("03", 1800);
                          List<String> remain = parseDtcs(verify, 0x43);
                          String text = t("Raspuns stergere: ", "Clear response: ") + clean(response)
                                  + "\n\n" + t("Erori ramase: ", "Remaining codes: ") + listOrNone(remain);
                          main.post(() -> {
                              dtcBox.setText(text);
                              clearButton.setEnabled(true);
                          });
                      } catch (Exception e) {
                          appendLog("CLEAR ERROR: " + e.getMessage());
                          main.post(() -> clearButton.setEnabled(true));
                      }
