              private void compareWithPrevious() {
                  String prev = prefs.getString("previous_scan", "");
                  String cur = currentScanText == null ? "" : currentScanText;
          
                  if (prev.trim().isEmpty()) {
                      dialog(t("Fara istoric", "No history"),
                              t("Salveaza mai intai o scanare.", "Save a scan snapshot first."));
                      return;
                  }
          
                  Set<String> oldCodes = extractAllCodes(prev);
                  Set<String> newCodes = extractAllCodes(cur);
          
                  Set<String> appeared = new HashSet<>(newCodes);
                  appeared.removeAll(oldCodes);
          
                  Set<String> gone = new HashSet<>(oldCodes);
                  gone.removeAll(newCodes);
          
                  Set<String> same = new HashSet<>(newCodes);
                  same.retainAll(oldCodes);
          
                  String text = t("ERORI NOI", "NEW FAULTS") + ":\n" + setOrNone(appeared)
                          + "\n\n" + t("DISPARUTE", "CLEARED/GONE") + ":\n" + setOrNone(gone)
                          + "\n\n" + t("RAMASE", "STILL PRESENT") + ":\n" + setOrNone(same);
          
                  deepBox.setText(text);
              }
          
              private Set<String> extractAllCodes(String s) {
                  HashSet<String> out = new HashSet<>();
                  if (s == null) return out;
          
                  Matcher m1 = Pattern.compile("\\b[PCBU][0-3][0-9A-F]{3}\\b",
                          Pattern.CASE_INSENSITIVE).matcher(s);
                  while (m1.find()) out.add(m1.group().toUpperCase(Locale.ROOT));
          
                  Matcher m2 = Pattern.compile("\\bUDS\\s+([0-9A-F]{6})\\b",
                          Pattern.CASE_INSENSITIVE).matcher(s);
                  while (m2.find()) out.add("UDS " + m2.group(1).toUpperCase(Locale.ROOT));
          
                  return out;
              }
          
              private String setOrNone(Set<String> s) {
                  if (s.isEmpty()) return t("Niciuna", "None");
                  ArrayList<String> sorted = new ArrayList<>(s);
                  Collections.sort(sorted);
                  StringBuilder sb = new StringBuilder();
                  for (String x : sorted) sb.append("• ").append(x).append("\n");
                  return sb.toString().trim();
              }
          
