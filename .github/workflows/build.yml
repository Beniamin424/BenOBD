              }

              private void scanSupportedPids() {
                  if (!requireConnection()) return;
                  io.execute(() -> {
                      StringBuilder sb = new StringBuilder();
                      try {
                          for (String cmd : Arrays.asList("0100", "0120", "0140", "0160", "0180", "01A0", "01C0")) {
                              String r = elm(cmd, 1400);
                              sb.append(cmd).append(": ").append(clean(r)).append("\n");
