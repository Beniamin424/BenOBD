                  sectionTitle(t("Jurnal tehnic", "Technical log"));

                  TextView logInfo = label(t(
                          "Jurnalul tehnic este acum pe o pagina separata. Scanarea continua sa scrie automat in el.",
                          "The technical log is now on a separate page. Scans continue writing to it automatically."),
                          12, MUTED, false);
                  logInfo.setPadding(dp(12), dp(10), dp(12), dp(10));
                  logInfo.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));
                  root.addView(logInfo, smallGap());

                  Button openLog = secondaryButton(
                          t("Deschide Jurnalul Tehnic", "Open Technical Log"));
                  openLog.setOnClickListener(v ->
                          startActivity(new Intent(this, LogActivity.class)));
                  root.addView(openLog, smallGap());
          
                  setContentView(scroll);
              }
          
              private LinearLayout row() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.HORIZONTAL);
                  return l;
              }
          
              private LinearLayout fieldCard(String name, EditText e) {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setPadding(dp(12), dp(10), dp(12), dp(10));
                  l.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));
                  l.addView(label(name, 12, MUTED, false));
                  l.addView(e);
                  return l;
              }
          
              private EditText edit(String value) {
                  EditText e = new EditText(this);
                  e.setText(value);
                  e.setTextColor(TEXT);
                  e.setHintTextColor(MUTED);
                  e.setSingleLine(true);
                  e.setTextSize(15);
                  e.setInputType(InputType.TYPE_CLASS_TEXT
                          | InputType.TYPE_TEXT_FLAG_CAP_CHARACTERS
                          | InputType.TYPE_TEXT_FLAG_NO_SUGGESTIONS);
                  e.setBackgroundColor(Color.TRANSPARENT);
                  return e;
              }
          
              private void sectionTitle(String text) {
                  TextView t = label(text, 20, TEXT, true);
                  LinearLayout.LayoutParams p = params();
                  p.topMargin = dp(24);
                  p.bottomMargin = dp(4);
                  root.addView(t, p);
              }
          
              private TextView metric(LinearLayout row, String name) {
                  LinearLayout box = new LinearLayout(this);
                  box.setOrientation(LinearLayout.VERTICAL);
                  box.setPadding(dp(12), dp(12), dp(12), dp(12));
                  box.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));
          
                  TextView n = label(name, 12, MUTED, false);
                  TextView v = label("--", 21, TEXT, true);
                  box.addView(n);
                  box.addView(v);
          
                  LinearLayout.LayoutParams p =
                          new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1);
                  p.setMargins(dp(3), dp(3), dp(3), dp(3));
                  row.addView(box, p);
                  return v;
              }
          
              private void choosePairedDevice() {
                  if (!hasBtPermission()) {
                      requestBtPermission();
                      return;
                  }
                  if (adapter == null) {
                      dialog("Bluetooth",
                              t("Bluetooth indisponibil pe acest telefon.",
                                      "Bluetooth unavailable on this phone."));
                      return;
                  }
          
                  Set<BluetoothDevice> bonded = adapter.getBondedDevices();
                  List<BluetoothDevice> devices = new ArrayList<>();
                  if (bonded != null) devices.addAll(bonded);
          
                  Collections.sort(devices, new Comparator<BluetoothDevice>() {
                      @Override public int compare(BluetoothDevice a, BluetoothDevice b) {
                          boolean aa = looksLikeObd(safeName(a));
                          boolean bb = looksLikeObd(safeName(b));
                          if (aa != bb) return aa ? -1 : 1;
                          return safeName(a).compareToIgnoreCase(safeName(b));
                      }
                  });
          
                  if (devices.isEmpty()) {
                      dialog(t("Niciun dispozitiv imperecheat", "No paired device"),
                              t("Imperecheaza ELM327/OBDLink din setarile Bluetooth Android, apoi revino.",
                                      "Pair the ELM327/OBDLink in Android Bluetooth settings, then return."));
                      return;
                  }
          
                  String[] names = new String[devices.size()];
                  for (int i = 0; i < devices.size(); i++) {
                      String mark = looksLikeObd(safeName(devices.get(i))) ? "OBD • " : "";
                      names[i] = mark + safeName(devices.get(i)) + "\n" + devices.get(i).getAddress();
                  }
          
                  new AlertDialog.Builder(this)
                          .setTitle(t("Alege adaptorul", "Choose adapter"))
                          .setItems(names, (d, which) -> {
                              selectedDevice = devices.get(which);
                              status.setText(t("Selectat: ", "Selected: ") + safeName(selectedDevice));
                          }).show();
              }
          
              private boolean looksLikeObd(String n) {
                  String low = n == null ? "" : n.toLowerCase(Locale.ROOT);
                  return low.contains("elm") || low.contains("obd") || low.contains("vgate")
                          || low.contains("vlink") || low.contains("obdii")
                          || low.contains("stn") || low.contains("mx+") || low.contains("obdlink");
              }
          
              private void connectSelected() {
                  if (!hasBtPermission()) {
                      requestBtPermission();
                      return;
                  }
                  if (selectedDevice == null) {
                      choosePairedDevice();
                      return;
                  }
          
                  status.setText(t("Conectare...", "Connecting..."));
                  connectButton.setEnabled(false);
          
                  io.execute(() -> {
                      try {
                          closeSocket();
                          socket = selectedDevice.createRfcommSocketToServiceRecord(SPP);
                          socket.connect();
                          input = socket.getInputStream();
                          output = socket.getOutputStream();
          
                          initElm();
          
                          String ati = elm("ATI", 1000);
                          String volts = elm("ATRV", 900);
                          String proto = elm("ATDP", 900);
          
                          appendLog("ADAPTER: " + clean(ati));
                          appendLog("VOLTAGE: " + clean(volts));
                          appendLog("PROTOCOL: " + clean(proto));
          
                          main.post(() -> {
                              status.setText(t("Conectat: ", "Connected: ")
                                      + safeName(selectedDevice) + " • " + clean(volts));
                              connectButton.setEnabled(true);
                          });
                      } catch (Exception e) {
                          appendLog("CONNECT ERROR: "
                                  + e.getClass().getSimpleName() + " " + e.getMessage());
                          closeSocket();
                          main.post(() -> {
                              status.setText(t("Conectarea a esuat", "Connection failed"));
                              connectButton.setEnabled(true);
                          });
                      }
                  });
              }
          
