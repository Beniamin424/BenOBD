              private GradientDrawable roundRect(int fill, int stroke, int width, int radius) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(fill);
                  d.setCornerRadius(dp(radius));
                  if (width > 0) d.setStroke(dp(width), stroke);
                  return d;
              }

              private LinearLayout.LayoutParams params() {
                  return new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
              }

              private LinearLayout.LayoutParams section() {
                  LinearLayout.LayoutParams p = params();
                  p.topMargin = dp(10);
                  return p;
              }

              private LinearLayout.LayoutParams smallGap() {
                  LinearLayout.LayoutParams p = params();
                  p.topMargin = dp(7);
                  return p;
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BenOBD-v3.apk

      - name: Upload BenOBD v3 APK
        uses: actions/upload-artifact@v4
        with:
          name: BenOBD-v3-APK
          path: BenOBD-v3.apk
          retention-days: 30
