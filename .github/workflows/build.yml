              private String pid(String pid, int bytes, String type) throws Exception {
                  String raw = elm("01" + pid, 1100);
                  int[] d = findPidBytes(raw, 0x41, Integer.parseInt(pid, 16), bytes);
                  if (d == null) return "--";
          
                  switch (type) {
                      case "rpm":
                          return String.format(Locale.US, "%.0f rpm",
                                  ((d[0] * 256) + d[1]) / 4.0);
                      case "speed":
                          return d[0] + " km/h";
                      case "temp":
                          return (d[0] - 40) + " °C";
                      case "percent":
                          return String.format(Locale.US, "%.0f %%",
                                  d[0] * 100.0 / 255.0);
                      case "maf":
                          return String.format(Locale.US, "%.2f g/s",
                                  ((d[0] * 256) + d[1]) / 100.0);
                      case "map":
                          return d[0] + " kPa";
                      case "timing":
                          return String.format(Locale.US, "%.1f °",
                                  d[0] / 2.0 - 64.0);
                      case "voltage":
                          return String.format(Locale.US, "%.2f V",
                                  ((d[0] * 256) + d[1]) / 1000.0);
                      case "seconds": {
                          int sec = d[0] * 256 + d[1];
                          int h = sec / 3600;
                          int m = (sec % 3600) / 60;
                          return h + "h " + m + "m";
                      }
                      case "fuelrate":
                          return String.format(Locale.US, "%.2f L/h",
                                  ((d[0] * 256) + d[1]) * 0.05);
                      case "distance":
                          return (d[0] * 256 + d[1]) + " km";
                      case "obdstd":
                          return "0x" + String.format(Locale.US, "%02X", d[0]);
                      default:
                          return "--";
                  }
              }
          
              private int[] findPidBytes(String raw, int mode, int pid, int count) {
                  int[] bytes = hexBytes(raw);
                  for (int i = 0; i < bytes.length - (count + 1); i++) {
                      if (bytes[i] == mode && bytes[i + 1] == pid) {
                          int[] out = new int[count];
                          for (int j = 0; j < count; j++) out[j] = bytes[i + 2 + j];
                          return out;
                      }
                  }
                  return null;
              }
          
              private List<String> parseDtcs(String raw, int responseMode) {
                  int[] b = hexBytes(raw);
                  List<String> out = new ArrayList<>();
                  int start = -1;
          
                  for (int i = 0; i < b.length; i++) {
                      if (b[i] == responseMode) {
                          start = i + 1;
                          break;
                      }
                  }
                  if (start < 0) return out;
          
                  for (int i = start; i + 1 < b.length; i += 2) {
                      int a = b[i], c = b[i + 1];
                      if (a == 0 && c == 0) continue;
          
                      char system = "PCBU".charAt((a >> 6) & 0x03);
                      int digit1 = (a >> 4) & 0x03;
                      int digit2 = a & 0x0F;
                      int digit3 = (c >> 4) & 0x0F;
                      int digit4 = c & 0x0F;
          
                      out.add("" + system + digit1
                              + hex1(digit2) + hex1(digit3) + hex1(digit4));
                  }
                  return out;
              }
          
              private char hex1(int v) {
                  return "0123456789ABCDEF".charAt(v & 0x0F);
              }
          
              private String listWithFamily(List<String> l) {
                  if (l.isEmpty()) return t("Niciuna / NO DATA", "None / NO DATA");
                  StringBuilder sb = new StringBuilder();
                  for (String s : l) {
                      sb.append("• ").append(s).append(" — ")
                              .append(dtcFamily(s)).append("\n")
                              .append("  ↳ ").append(describeDtc(s)).append("\n");
                  }
                  return sb.toString().trim();
              }

              private static class TimedResponse {
                  final String response;
                  final long ms;
                  TimedResponse(String response, long ms) {
                      this.response = response;
                      this.ms = ms;
                  }
              }

              private TimedResponse timedElm(String command, long waitMs) throws Exception {
                  long start = SystemClock.elapsedRealtime();
                  String response = elm(command, waitMs);
                  return new TimedResponse(response,
                          SystemClock.elapsedRealtime() - start);
              }

