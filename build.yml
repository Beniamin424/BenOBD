              private String pid(String pid, int bytes, String type) throws Exception {
                  String raw = elm("01" + pid, 1100);
                  int[] d = findPidBytes(raw, 0x41, Integer.parseInt(pid, 16), bytes);
                  if (d == null) return "--";

                  switch (type) {
                      case "rpm":
                          return String.format(Locale.US, "%.0f rpm", ((d[0] * 256) + d[1]) / 4.0);
                      case "speed":
                          return d[0] + " km/h";
                      case "temp":
                          return (d[0] - 40) + " °C";
                      case "percent":
                          return String.format(Locale.US, "%.0f %%", d[0] * 100.0 / 255.0);
                      case "maf":
                          return String.format(Locale.US, "%.2f g/s", ((d[0] * 256) + d[1]) / 100.0);
                      case "map":
                          return d[0] + " kPa";
                      case "timing":
                          return String.format(Locale.US, "%.1f °", d[0] / 2.0 - 64.0);
                      case "voltage":
                          return String.format(Locale.US, "%.2f V", ((d[0] * 256) + d[1]) / 1000.0);
                      default:
                          return "--";
                  }
              }

              private int[] findPidBytes(String raw, int mode, int pid, int count) {
                  int[] bytes = hexBytes(raw);
                  for (int i = 0; i < bytes.length - (count + 1); i++) {
                      if (bytes[i] == mode && bytes[i + 1] == pid) {
                          int[] out = new int[count];
                          for (int j = 0; j < count; j++) out[j] = bytes[i + 2 + j];
                          return out;
                      }
                  }
                  return null;
              }

              private List<String> parseDtcs(String raw, int responseMode) {
                  int[] b = hexBytes(raw);
                  List<String> out = new ArrayList<>();
                  int start = -1;
                  for (int i = 0; i < b.length; i++) {
                      if (b[i] == responseMode) {
                          start = i + 1;
                          break;
                      }
                  }
                  if (start < 0) return out;
                  for (int i = start; i + 1 < b.length; i += 2) {
                      int a = b[i], c = b[i + 1];
                      if (a == 0 && c == 0) continue;
                      char system = "PCBU".charAt((a >> 6) & 0x03);
                      int digit1 = (a >> 4) & 0x03;
                      int digit2 = a & 0x0F;
                      int digit3 = (c >> 4) & 0x0F;
                      int digit4 = c & 0x0F;
                      out.add("" + system + digit1 + hex1(digit2) + hex1(digit3) + hex1(digit4));
                  }
                  return out;
              }

              private char hex1(int v) {
                  return "0123456789ABCDEF".charAt(v & 0x0F);
              }

              private String listOrNone(List<String> l) {
                  if (l.isEmpty()) return t("Niciuna / NO DATA", "None / NO DATA");
                  StringBuilder sb = new StringBuilder();
                  for (String s : l) sb.append("• ").append(s).append("\n");
                  return sb.toString().trim();
              }

              private int[] hexBytes(String raw) {
                  if (raw == null) return new int[0];
                  String normalized = raw.toUpperCase(Locale.ROOT)
                          .replaceAll("SEARCHING\\.\\.\\.", " ")
                          .replaceAll("BUS INIT:.*", " ")
                          .replaceAll("[^0-9A-F]", " ");
                  String[] tokens = normalized.trim().split("\\s+");
                  ArrayList<Integer> vals = new ArrayList<>();
                  for (String token : tokens) {
                      if (token.length() == 2) {
                          try { vals.add(Integer.parseInt(token, 16)); } catch (Exception ignored) {}
                      }
                  }
                  int[] r = new int[vals.size()];
                  for (int i = 0; i < vals.size(); i++) r[i] = vals.get(i);
                  return r;
              }

              private String decodeVin(String raw) {
                  int[] b = hexBytes(raw);
                  StringBuilder vin = new StringBuilder();
                  boolean after = false;
                  for (int i = 0; i < b.length; i++) {
                      if (!after && b[i] == 0x49 && i + 2 < b.length && b[i + 1] == 0x02) {
                          after = true;
                          i += 2;
                          continue;
                      }
                      if (after) {
                          int v = b[i];
                          if (v >= 0x20 && v <= 0x7E) vin.append((char) v);
                      }
                  }
                  String s = vin.toString().replaceAll("[^A-HJ-NPR-Z0-9]", "");
                  if (s.length() >= 17) return s.substring(0, 17);
                  return s;
              }

              private String elm(String command, long waitMs) throws Exception {
                  if (output == null || input == null) throw new IllegalStateException("No ELM327 socket");
                  while (input.available() > 0) input.read();

                  output.write((command + "\r").getBytes(StandardCharsets.US_ASCII));
                  output.flush();

                  long end = System.currentTimeMillis() + waitMs;
                  StringBuilder sb = new StringBuilder();

                  while (System.currentTimeMillis() < end) {
                      while (input.available() > 0) {
                          int v = input.read();
                          if (v < 0) break;
                          char c = (char) v;
                          if (c == '>') {
                              String r = sb.toString().trim();
                              appendLog("> " + command + "\n" + clean(r));
                              return r;
                          }
                          sb.append(c);
                      }
                      Thread.sleep(20);
                  }

                  String r = sb.toString().trim();
                  appendLog("> " + command + "\n" + clean(r) + " [timeout]");
                  return r;
              }

              private void appendLog(String text) {
                  main.post(() -> {
                      if (log == null) return;
                      String old = log.getText().toString();
                      String next = old + "\n\n" + text;
                      if (next.length() > 18000) next = next.substring(next.length() - 18000);
                      log.setText(next);
                  });
              }

              private boolean requireConnection() {
                  if (isConnected()) return true;
                  dialog(t("ELM327 neconectat", "ELM327 disconnected"),
                          t("Alege adaptorul si conecteaza-l mai intai.", "Choose and connect the adapter first."));
                  return false;
              }

              private boolean isConnected() {
                  return socket != null && socket.isConnected() && input != null && output != null;
              }

              private void closeSocket() {
                  liveRunning = false;
                  main.removeCallbacks(liveTick);
                  try { if (input != null) input.close(); } catch (Exception ignored) {}
                  try { if (output != null) output.close(); } catch (Exception ignored) {}
                  try { if (socket != null) socket.close(); } catch (Exception ignored) {}
                  input = null;
                  output = null;
                  socket = null;
              }

              @Override protected void onDestroy() {
                  closeSocket();
                  io.shutdownNow();
                  super.onDestroy();
              }

              private boolean hasBtPermission() {
                  return Build.VERSION.SDK_INT < 31
                          || checkSelfPermission(Manifest.permission.BLUETOOTH_CONNECT) == PackageManager.PERMISSION_GRANTED;
              }

              private void requestBtPermission() {
                  if (Build.VERSION.SDK_INT >= 31 && !hasBtPermission()) {
                      requestPermissions(new String[]{Manifest.permission.BLUETOOTH_CONNECT}, 77);
                  }
              }

              private String safeName(BluetoothDevice d) {
                  if (d == null) return "ELM327";
                  try {
                      String n = d.getName();
                      return n == null || n.trim().isEmpty() ? "ELM327" : n;
                  } catch (SecurityException e) {
                      return "ELM327";
                  }
              }

              private String clean(String s) {
                  if (s == null) return "";
                  return s.replace("\r", " ").replace("\n", " ").replaceAll("\\s+", " ").trim();
              }

              private String t(String ro, String en) { return english ? en : ro; }

              private void toast(String s) { Toast.makeText(this, s, Toast.LENGTH_SHORT).show(); }

              private void dialog(String title, String msg) {
                  new AlertDialog.Builder(this).setTitle(title).setMessage(msg).setPositiveButton("OK", null).show();
              }

              private TextView label(String text, int size, int color, boolean bold) {
                  TextView v = new TextView(this);
                  v.setText(text);
                  v.setTextSize(size);
                  v.setTextColor(color);
                  v.setTypeface(Typeface.create("sans-serif-light", bold ? Typeface.BOLD : Typeface.NORMAL));
                  v.setGravity(Gravity.CENTER_VERTICAL);
                  return v;
              }

              private TextView monoBox(String text) {
                  TextView v = label(text, 12, Color.rgb(201, 209, 213), false);
                  v.setTypeface(Typeface.MONOSPACE);
                  v.setPadding(dp(12), dp(12), dp(12), dp(12));
                  v.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));
                  v.setTextIsSelectable(true);
                  return v;
              }

              private Button button(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.rgb(15, 17, 19));
                  b.setTextSize(15);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.create("sans-serif-light", Typeface.BOLD));
                  b.setBackground(roundRect(ACCENT, ACCENT, 0, 13));
                  return b;
              }

              private Button compactButton(String text) {
                  Button b = button(text);
                  b.setTextSize(13);
                  return b;
              }

              private Button secondaryButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(TEXT);
                  b.setTextSize(14);
                  b.setAllCaps(false);
                  b.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));
                  b.setBackground(roundRect(CARD2, Color.rgb(66, 73, 78), 1, 13));
                  return b;
              }

              private Button dangerButton(String text) {
                  Button b = secondaryButton(text);
                  b.setTextColor(Color.rgb(255, 205, 205));
                  b.setBackground(roundRect(Color.rgb(45, 20, 22), Color.rgb(116, 55, 58), 1, 13));
                  return b;
              }

              private Switch makeSwitch(String title, String description) {
                  Switch s = new Switch(this);
                  s.setText(title + "\n" + description);
                  s.setTextColor(TEXT);
                  s.setTextSize(14);
                  s.setPadding(dp(12), dp(10), dp(10), dp(10));
                  s.setGravity(Gravity.CENTER_VERTICAL);
                  s.setTypeface(Typeface.create("sans-serif-light", Typeface.NORMAL));
                  s.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 14));
                  return s;
              }

              private LinearLayout cardHorizontal() {
                  LinearLayout l = new LinearLayout(this);
                  l.setOrientation(LinearLayout.HORIZONTAL);
                  l.setGravity(Gravity.CENTER_VERTICAL);
                  l.setPadding(dp(10), dp(10), dp(10), dp(10));
                  l.setBackground(roundRect(CARD, Color.rgb(43, 48, 53), 1, 16));
                  return l;
              }

              private GradientDrawable roundRect(int fill, int stroke, int width, int radius) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(fill);
                  d.setCornerRadius(dp(radius));
                  if (width > 0) d.setStroke(dp(width), stroke);
                  return d;
              }

              private LinearLayout.LayoutParams params() {
                  return new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
              }

              private LinearLayout.LayoutParams section() {
                  LinearLayout.LayoutParams p = params();
                  p.topMargin = dp(10);
                  return p;
              }

              private LinearLayout.LayoutParams smallGap() {
                  LinearLayout.LayoutParams p = params();
                  p.topMargin = dp(7);
                  return p;
              }

              private int dp(int value) {
                  return Math.round(value * getResources().getDisplayMetrics().density);
              }
          }
