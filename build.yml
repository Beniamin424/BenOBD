                  mafV = metric(grid4, "MAF");
                  mapV = metric(grid4, "MAP");
                  root.addView(grid4, smallGap());

                  LinearLayout grid5 = new LinearLayout(this);
                  grid5.setOrientation(LinearLayout.HORIZONTAL);
                  fuelV = metric(grid5, t("Nivel combustibil", "Fuel level"));
                  timingV = metric(grid5, t("Avans", "Timing"));
                  root.addView(grid5, smallGap());

                  LinearLayout grid6 = new LinearLayout(this);
                  grid6.setOrientation(LinearLayout.HORIZONTAL);
                  voltageV = metric(grid6, t("Tensiune ECU", "ECU voltage"));
                  ambientV = metric(grid6, t("Temp. ambient", "Ambient temp"));
